name: APK uret
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Oyunu kopyala
        run: mkdir -p app/src/main/assets && cp index.html app/src/main/assets/index.html
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: krallik-seferi-apk
          path: app/build/outputs/apk/release/*.apk
      - name: APK'yi depoya koy
        run: |
          mkdir -p dist && cp app/build/outputs/apk/release/*.apk dist/krallik-seferi.apk
          git config user.name github-actions && git config user.email actions@github.com
          git add dist && git commit -m "APK [skip ci]" && git push
