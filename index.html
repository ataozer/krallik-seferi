ACT.m20sr=()=>{const w=['KURT','KARTAL','DEMIR','GOLGE','ATES','BUZ','TAHT','KALKAN'];m20().seed=w[(Math.random()*w.length)|0]+((Math.random()*90+10)|0);ACT.m20sd()};
ACT.m20sx=()=>{m20().seed=null;ACT.m20sd()};
const _dt8=dailyTick;dailyTick=function(){const sd=G.m&&G.m.seed;if(!sd)return _dt8();const o=Math.random;Math.random=mul(hstr(sd+'|'+G.day));try{_dt8()}finally{Math.random=o}};
// başarımlar
const ACH=[['Ilk kan','İlk savaşı kazan',()=>m20().win>=1],['Savaş hevesi','10 savaş kazan',()=>m20().win>=10],['Savaş tanrısı','50 savaş kazan',()=>m20().win>=50],['Yüz kılıç','100 düşmanı etkisiz bırak',()=>G.kills>=100],['Bin kılıç','1000 düşman',()=>G.kills>=1000],['Düellocu','Bir düello kazan',()=>m20().duel>=1],['Canavar avcısı','Efsanevi yaratık yen',()=>m20().boss>=1],['Kâşif','3 harabe bul',()=>G.ruin&&Object.keys(G.ruin).length>=3],['Zengin','5000 altın',()=>G.gold>=5000],['Ünlü','150 nam',()=>G.renown>=150],['Ordu kurucu','100 asker',()=>troopCount()>=100],['Toprak sahibi','1 mülk',()=>G.X&&G.X.own&&G.X.own.length>=1],['Kral','Krallık kur',()=>!!G.kd],['Gölge','3 gizli görev',()=>(m20().spyW||0)>=3],['Esnaf','Bir özel silah yaptır',()=>m20().named&&m20().named.length>=1],['Tüccar','Pazarda 10 işlem',()=>(m20().trd||0)>=10],['Sadık','3 yoldaş hikâyesi bitir',()=>G.X&&G.X.cmp&&G.X.cmp.filter(c=>(c.ch||0)>=3).length>=3],['Kader','Bir son yaşa',()=>m20().end&&m20().end.length>=1],['Haftalık','Bir ferman ödülü al',()=>m20().dec&&m20().dec.got],['Şölen','Festival düzenle',()=>m20().fday!=null]];
function achCheck(){const m=m20();m.ach=m.ach||{};for(let i=0;i<ACH.length;i++){if(m.ach[i])continue;let ok=false;try{ok=!!ACH[i][2]()}catch(_){}if(ok){m.ach[i]=1;wmsg('Başarım: '+ACH[i][0]);toast('Başarım: '+ACH[i][0])}}}
const _dt9=dailyTick;dailyTick=function(){_dt9();try{achCheck()}catch(_){}};
const _fb6=finishBattle;finishBattle=function(w,r){_fb6(w,r);try{achCheck()}catch(_){}};
ACT.m20ac=()=>{achCheck();const m=m20(),n=Object.keys(m.ach).length;openPanel(`<h2>Başarımlar</h2><div class="sub">${n}/${ACH.length}</div><div class="list">${ACH.map((a,i)=>`<div class="row"><b>${m.ach[i]?'✓ ':''}${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="row2"><button class="btn" data-a="m20">Geri</button><button class="btn gold" data-a="close">Kapat</button></div>`)};
const _by=ACT.m20by,_sl=ACT.m20sl;ACT.m20by=d=>{m20().trd=(m20().trd||0)+1;_by(d)};ACT.m20sl=d=>{m20().trd=(m20().trd||0)+1;_sl(d)};

/* ===== mod20 · Tur 10 — hikâye kartı, müzik, pil modu, titreşim, atmosfer ===== */
M20.hub.push(['m20au','Ses & titreşim']);
const AU={on:1,vib:1,ctx:null,g:null,nz:null,nf:null,dr:[],t:0};
try{Object.assign(AU,JSON.parse(localStorage.getItem('krallik_au')||'{}'),{ctx:null})}catch(_){}
const auSave=()=>{try{localStorage.setItem('krallik_au',JSON.stringify({on:AU.on,vib:AU.vib}))}catch(_){}};
function auInit(){if(AU.ctx||!AU.on)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.ctx=new C();AU.g=c.createGain();AU.g.gain.value=.0;AU.g.connect(c.destination);
 const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;n.loop=true;AU.nf=c.createBiquadFilter();AU.nf.type='lowpass';AU.nf.frequency.value=300;AU.ng=c.createGain();AU.ng.gain.value=.05;n.connect(AU.nf);AU.nf.connect(AU.ng);AU.ng.connect(AU.g);n.start();
 [55,82.4,110].forEach((f,i)=>{const o=c.createOscillator();o.type=i?'triangle':'sine';o.frequency.value=f;const g=c.createGain();g.gain.value=i?.03:.06;o.connect(g);g.connect(AU.g);o.start();AU.dr.push({o,g,f})});
 AU.g.gain.linearRampToValueAtTime(.5,c.currentTime+2)}catch(_){AU.ctx=null}}
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{if(AU.on){auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume()}},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(AU.ctx)document.hidden?AU.ctx.suspend():(AU.on&&AU.ctx.resume())});
let auMode='',auLast=0;
function auUpdate(){if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime;let m='w',ten=0;
 if(scene==='battle'&&phase==='battle'){m='b';let a=0,e=0;for(let i=0;i<cnt;i++)if(hp[i]>0){team[i]===0?a++:e++}ten=Math.min(1,(a+e)/260)}
 else if(typeof scene!=='undefined'&&scene==='world'){m='w';ten=(G&&G.fc&&G.fc.length>0)?.3:0}
 const bt=m==='b';
 AU.nf.frequency.setTargetAtTime(bt?900+ten*900:(G&&G.wx&&G.wx.t==='storm'?1200:350),t,.5);AU.ng.gain.setTargetAtTime(bt?.04:.05,t,.5);
 AU.dr.forEach((d,i)=>{const f=bt?d.f*(1.5+ten*.25):d.f;d.o.frequency.setTargetAtTime(f,t,.8);d.g.gain.setTargetAtTime((i?.03:.06)*(bt?1.4+ten:1),t,.8)});auMode=m}
setInterval(auUpdate,700);
function auHit(f,d,v){if(!AU.ctx||!AU.on)return;try{const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(f,c.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,c.currentTime+d);g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(_){}}
const vib=p=>{if(AU.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(_){}};
const _ua10=useAbil;useAbil=function(k){const r=_ua10.apply(this,arguments);auHit(220,.25,.08);vib(25);return r};
const _fb10=finishBattle;finishBattle=function(w,r){_fb10(w,r);auHit(w?523:130,.6,.1);vib(w?[40,60,40]:[120])};
const _bp10=startBattle;startBattle=function(){const r=_bp10.apply(this,arguments);auHit(110,.5,.1);vib(60);return r};
ACT.m20au=()=>{openPanel(`<h2>Ses & titreşim</h2><div class="acts"><button class="btn" data-a="m20at" data-k="on">Ses/müzik: ${AU.on?'Açık':'Kapalı'}</button><button class="btn" data-a="m20at" data-k="vib">Titreşim: ${AU.vib?'Açık':'Kapalı'}</button></div><div class="sub">Müzik savaşta gerilimle yükselir, haritada sakinleşir. Pil %20 altında otomatik düşük grafik.</div><div class="row2"><button class="btn" data-a="m20">Geri</button><button class="btn gold" data-a="close">Kapat</button></div>`)};
ACT.m20at=d=>{AU[d.k]=AU[d.k]?0:1;auSave();if(d.k==='on'){if(AU.on)auInit();else if(AU.ctx){AU.ctx.close();AU.ctx=null;AU.dr=[]}}ACT.m20au()};

let batLow=false;
function batChk(b){const low=b.level<.2&&!b.charging;if(low&&!batLow){batLow=true;GF._p0=GF.p;GF.p='low';try{applyGfx(true)}catch(_){}toast('Pil düşük: düşük grafik modu')}else if(!low&&batLow){batLow=false;GF.p=GF._p0||'auto';try{applyGfx(true)}catch(_){}}}

addEventListener('offline',()=>toast('Çevrimdışı: oyun tamamen çalışır'));

ACT.m20sk=()=>{const m=m20(),c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#1b1226');g.addColorStop(1,'#3a1a1a');x.fillStyle=g;x.fillRect(0,0,1080,1350);
 const f=flg0(),svg=new Image(),sv=flagSvg(f,300).replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" height="200"');
 const done=()=>{x.fillStyle='#e0b552';x.font='bold 72px system-ui';x.textAlign='center';x.fillText(myName(),540,520);x.font='36px system-ui';x.fillStyle='#fff';
  const L=['Gün '+G.day+' · Nam '+Math.round(G.renown),'Kazanılan savaş: '+m.win+' · Düello: '+m.duel,'Yenilen yaratık: '+m.boss,'Başarım: '+Object.keys(m.ach||{}).length+'/'+ACH.length,'Skor: '+myScore()];L.forEach((l,i)=>x.fillText(l,540,640+i*80));
  x.fillStyle='#e0b552';x.font='bold 40px system-ui';x.fillText('Krallık Seferi · AtaCoplay',540,1230);x.fillStyle='#fff9';x.font='30px system-ui';x.fillText('Çok yakında, kapalı betada!',540,1285);
  c.toBlob(async b=>{const fl=new File([b],'hikaye.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return}}catch(_){}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hikaye.png';a.click();toast('Kart indirildi')})};
 svg.onload=()=>{x.drawImage(svg,390,250,300,200);done()};svg.onerror=done;svg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sv)};
