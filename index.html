<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Krallık Seferi</title>
<style>
/* VOICE: sefer günlüğü; sert, sade, oyun alanı her şey
   IDEA: deri ve pirinçten sahra masası, üzerinde boyalı harita
   PICTURE: tam ekran dünya haritası ve WebGL savaş meydanı
   COLOUR and TYPE: koyu deri #1c140d, pirinç #e0b552, millet renkleri; sistem sans, Georgia başlık
   LAYOUT: yatay ekran; üstte kaynak şeridi, sağ üstte düğmeler, paneller ortada */
:root{--ink:#f4e8cf;--mut:#cdb894;--pan:#1c140deb;--pan2:#2c2016;--line:#6a5137;--gold:#e0b552;--bad:#ff8a6a;--good:#9fd27a;
 --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#141008;color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
canvas.scene{position:fixed;inset:0;width:100%;height:100%;display:block}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--gold);margin:0;text-wrap:balance}
.btn{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--pan2);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{border-color:#e5c06a;background:linear-gradient(#d3a446,#9c7224);color:#1d1209}
.btn:disabled{opacity:.4;cursor:default}
.tb{height:44px;min-width:44px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--pan);display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.tb svg{width:21px;height:21px;flex:none}
.tb.on{background:var(--gold);color:#1d1209;border-color:#f0d080}
/* dünya HUD */
#wHud{position:fixed;z-index:2;top:calc(var(--st) + 6px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#res{display:flex;flex-wrap:wrap;gap:5px;pointer-events:none;max-width:62%}
.rc{background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:3px 9px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc small{color:var(--mut);font-weight:700;font-size:11px}
.rc.low{border-color:var(--bad);color:var(--bad)}
#wBtns{display:flex;gap:6px;pointer-events:auto;align-items:flex-start}
#clock{font-family:Georgia,serif}
#zoomB{position:fixed;z-index:2;right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 8px);display:flex;flex-direction:column;gap:6px}
#wMsg{position:fixed;z-index:2;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 8px);max-width:min(420px,60vw);display:flex;flex-direction:column;gap:3px;pointer-events:none}
#wMsg div{background:#1c140dcc;border-radius:7px;padding:3px 9px;font-size:12.5px;color:var(--mut);transition:opacity .8s}
/* paneller */
.ov{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:10px calc(var(--sr) + 12px) 10px calc(var(--sl) + 12px);background:#0d0906b8;overflow:auto}
.panel{width:min(640px,100%);max-height:calc(100vh - 20px);overflow:auto;background:var(--pan);border:1px solid var(--gold);border-radius:16px;padding:12px 14px;box-shadow:0 10px 40px #000a}
.panel h2{font-size:24px;line-height:1.1}
.panel .sub{color:var(--mut);font-size:13px;margin:2px 0 8px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:8px}
.acts .btn{justify-content:space-between;text-align:left}
.acts .btn span{color:var(--mut);font-size:12px;font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.vs .sd{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.vs b{font-size:26px;display:block}
.vs small{color:var(--mut)}
.vs em{font-style:normal;font-weight:800;color:var(--mut)}
.list{display:grid;gap:5px;margin-top:6px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--pan2);border:1px solid var(--line);border-radius:11px;padding:6px 9px}
.trow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line)}
.trow .ic svg{width:18px;height:18px}
.trow .nm{font-weight:800;font-size:14px}
.trow .meta{font-size:12px;color:var(--mut)}
.trow .ct{font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.trow .ct small{display:block;font-size:11px;color:var(--bad);font-weight:700}
.xpb{height:5px;background:#0008;border-radius:3px;overflow:hidden;margin-top:3px;width:min(220px,100%)}
.xpb i{display:block;height:100%;background:var(--gold)}
.ups{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.ups .btn{min-height:38px;font-size:12.5px;padding:0 10px}
.tabs{display:flex;gap:6px;margin:4px 0}
.note{font-size:12.5px;color:var(--mut)}
.row2{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px}
/* başlangıç */
#title{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2b1d12,#0d0906);padding:12px calc(var(--sr) + 14px) 12px calc(var(--sl) + 14px);overflow:auto}
#title h1{font-size:clamp(30px,5.4vw,50px);text-align:center;line-height:1.05}
#title .sub{text-align:center;color:var(--mut);margin:4px 0 12px}
.nats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nat{border:1px solid var(--line);background:var(--pan2);border-radius:12px;padding:8px;text-align:left;min-height:86px}
.nat.on{border-color:var(--gold);background:#4a3520;box-shadow:0 0 0 2px #e0b55244}
.nat b{display:flex;align-items:center;gap:6px;font-size:14px}
.nat i{width:12px;height:12px;border-radius:3px;flex:none}
.nat span{display:block;font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.3}
.tgo{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tgo .btn{min-height:50px;font-size:17px;padding:0 26px}
/* savaş HUD */
#bHud .hud{position:fixed;z-index:2;pointer-events:none}
#bTop{top:calc(var(--st) + 6px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:6px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.side small{font-size:11px;color:var(--mut)}
.side i{width:10px;height:10px;border-radius:50%}
#powW{width:clamp(110px,22vw,220px);height:12px;border-radius:7px;overflow:hidden;background:#3f86d6;border:1px solid #0009}
#powP{height:100%;width:50%;background:#d24b3c;transition:width .25s}
#wInfo{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 4px);font:11px/1.2 system-ui,sans-serif;color:#fff;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000;white-space:nowrap}body:not(.sc-b) #wInfo{display:none}
#hpW{position:fixed;z-index:2;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 8px);width:150px;height:10px;background:#0008;border:1px solid var(--line);border-radius:6px;overflow:hidden;pointer-events:none}
#hpB{height:100%;width:100%;background:linear-gradient(90deg,#c0392b,#e8704a)}
#bTL{position:fixed;z-index:3;top:calc(var(--st) + 6px);left:calc(var(--sl) + 8px);display:flex;gap:6px}
#bTR{position:fixed;z-index:3;top:calc(var(--st) + 6px);right:calc(var(--sr) + 8px);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#fps{font:700 11px ui-monospace,monospace;color:var(--mut);background:var(--pan);border:1px solid var(--line);border-radius:7px;padding:2px 6px}
#ordL{position:fixed;z-index:2;left:calc(var(--sl) + 8px);top:calc(var(--st) + 58px);display:flex;flex-direction:column;gap:3px;pointer-events:none}
#ordL span{font-size:12px;background:var(--pan);border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--mut)}
#ordL b{color:var(--ink)}
#joy{position:fixed;z-index:3;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid #ffffff40;background:#00000030;display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#f4e8cfcc;border:2px solid var(--gold)}
#atk{position:fixed;z-index:3;right:calc(var(--sr) + 24px);bottom:calc(var(--sb) + 20px);width:100px;height:100px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle,#3a2818 55%,#22180f);display:grid;place-items:center}
#atk svg{width:40px;height:40px}
#ring{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--gold) 0deg,transparent 0deg);-webkit-mask:radial-gradient(circle,transparent 55px,#000 56px);mask:radial-gradient(circle,transparent 55px,#000 56px)}
#qcB{position:fixed;z-index:3;left:50%;transform:translateX(-50%);top:calc(var(--st,0px) + 42px);display:flex;gap:5px}#qcB.hide{display:none}#qcB button{width:52px;height:56px;padding:0;border:1px solid var(--gold);border-radius:9px;background-size:cover;background-position:center 30%;position:relative;overflow:hidden;box-shadow:0 2px 6px #0008}#qcB button span{position:absolute;left:0;right:0;bottom:0;font:700 9px system-ui;color:#fff;background:#6a1a14e6;padding:1px 0}#qcB button:active{transform:scale(.93)}
#cmdB{position:fixed;z-index:3;right:calc(var(--sr) + 136px);bottom:calc(var(--sb) + 26px)}
#wheel{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:#0006}
#wheel.on{display:grid}
.wcard{background:var(--pan);border:1px solid var(--gold);border-radius:16px;padding:12px;width:min(560px,90vw)}
.wcard h3{margin:0 0 8px;font:800 15px system-ui;color:var(--gold);display:flex;justify-content:space-between}
.wg,.wo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wg{margin-bottom:8px}
.wb{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--pan2);font-weight:800;font-size:14px}
.wb.on{background:var(--gold);color:#1d1209;border-color:#f0d080}
.wo .wb{background:#3a2818}
#hint{position:fixed;z-index:2;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);font-size:13px;color:var(--mut);background:var(--pan);padding:4px 10px;border-radius:8px;border:1px solid var(--line);pointer-events:none;white-space:nowrap;transition:opacity .6s}
#toast{position:fixed;z-index:8;left:50%;top:calc(var(--st) + 56px);transform:translateX(-50%);background:var(--pan);border:1px solid var(--gold);padding:6px 14px;border-radius:10px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
/* hazırlık: savaş planı şeridi */
#prepTop{position:fixed;z-index:3;left:50%;top:calc(var(--st) + 50px);transform:translateX(-50%);background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:4px 12px;font-size:13px;color:var(--mut);white-space:nowrap;pointer-events:none}
#prepTop b{color:var(--gold)}
#prepBar{position:fixed;z-index:3;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 6px);display:flex;gap:6px;align-items:stretch}
.pb{flex:none;width:122px;border-radius:12px;border:1px solid var(--gold);background:#3a2818;text-align:left;padding:5px 9px;display:flex;flex-direction:column;justify-content:center}
.pb small{color:var(--mut);font-size:11px}.pb b{font-size:13px;line-height:1.15}
#grpCards{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.gc{flex:1 0 150px;border-radius:12px;border:1px solid var(--line);background:var(--pan);padding:5px 7px;display:grid;grid-template-columns:1fr 1fr;gap:4px;text-align:left}
.gc.sel{border-color:var(--gold);box-shadow:0 0 0 2px #e0b55255;background:#4a3520}
.gc .hd{grid-column:1/-1;display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.gc .hd span{color:var(--mut);font-weight:700}
.gc button{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--pan2);font-weight:800;font-size:12px;padding:0 4px}
.gc.off{opacity:.4}
#goB{position:fixed;z-index:3;right:calc(var(--sr) + 8px);top:calc(var(--st) + 36px);min-height:48px;font-size:16px}
#prepPop{position:fixed;z-index:4;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 84px);width:min(420px,72vw);background:var(--pan);border:1px solid var(--gold);border-radius:14px;padding:6px;display:grid;gap:4px;max-height:calc(100vh - 140px);overflow:auto}
#prepPop .ph{font-size:12px;color:var(--mut);padding:2px 4px}
#prepPop button{text-align:left;border:1px solid var(--line);background:var(--pan2);border-radius:10px;padding:6px 10px;min-height:44px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
#prepPop button.on{border-color:var(--gold);background:#4a3520}
#prepPop b{font-size:14px}#prepPop span{font-size:12px;color:var(--mut);grid-column:2}
#prepPop svg{grid-row:span 2;width:58px;height:34px}
#abBar{position:fixed;z-index:3;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 26px);display:flex;gap:6px}
.ab{position:relative;width:64px;height:54px;border-radius:12px;border:1px solid var(--gold);background:var(--pan);font-weight:800;font-size:11px;line-height:1.1;padding:2px;overflow:hidden}
.ab i{position:absolute;left:0;right:0;bottom:0;background:#000a;pointer-events:none}
.ab.on{background:var(--gold);color:#1d1209}
.ab:disabled{color:var(--mut)}
#rot{position:fixed;inset:0;z-index:9;display:none;place-items:center;text-align:center;background:#0d0906;padding:24px}
#rot svg{width:72px;height:72px;color:var(--gold)}
#rot p{font-weight:800;font-size:18px;margin:12px 0 4px}
#rot span{color:var(--mut)}
@media(orientation:portrait) and (pointer:coarse){#rot{display:grid}}
@media(max-height:430px){.panel h2{font-size:20px}.nat{min-height:74px;padding:6px}.nat span{font-size:11px}#title .sub{margin-bottom:6px}.tgo{margin-top:8px}}
@media(max-width:700px){.nats{grid-template-columns:repeat(3,minmax(0,1fr))}#res{max-width:55%}}
@media(prefers-reduced-motion:reduce){#powP,#hint,#toast,#wMsg div{transition:none}}
#title .tw{width:min(900px,100%);text-align:center}#logoC{max-height:46vh;width:auto;height:auto;max-width:min(640px,86vw)}
.tmenu{display:flex;flex-direction:column;gap:8px;width:min(300px,80vw);margin:6px auto}.tmenu .btn{font-size:18px;padding:10px;justify-content:center}.tfoot{margin-top:10px;letter-spacing:.4em;font-weight:700;color:#e8bd48;opacity:.85;font-size:14px}
#intro{position:fixed;inset:0;z-index:20;background:#000}#introC{width:100%;height:100%;display:block}
#cc{position:fixed;inset:0;z-index:8;background:radial-gradient(circle at 50% 30%,#2b1d12,#0d0906);overflow:auto;padding:10px calc(var(--sr) + 12px) 10px calc(var(--sl) + 12px)}
.ccb{display:flex;gap:16px;min-height:100%;align-items:center;justify-content:center}.ccl{text-align:center;flex:none;max-width:240px}.ccl canvas{background:#2a1d12;border:2px solid var(--gold);border-radius:14px}.ccr{flex:1;max-width:560px}.ccr h2{margin:0 0 6px}
.ccrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.ccrow input:not([type=range]){background:var(--pan2);border:1px solid var(--line);color:inherit;border-radius:10px;padding:8px;width:130px}
.chip{border:1px solid var(--line);background:var(--pan2);color:inherit;border-radius:999px;padding:6px 10px;font-size:13px}.chip.on{background:var(--gold);color:#1a1008;border-color:var(--gold)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #000a}.sw.on{border:3px solid #fff}
.ccq{display:flex;flex-direction:column;gap:8px}.ccq .btn{text-align:left;justify-content:flex-start;padding:12px}.ccs{max-height:48vh;overflow:auto;font-size:14px;line-height:1.5}
#pbtn{position:fixed;z-index:3;left:calc(var(--sl) + 8px);top:calc(var(--st) + 6px);width:60px;height:60px;border-radius:50%;border:2px solid var(--gold);background:#2a1d12;padding:0;overflow:hidden;pointer-events:auto}#pbtn canvas{width:100%;height:100%}
#wHud{left:calc(var(--sl) + 76px)!important}
#tut{position:fixed;z-index:3;left:calc(var(--sl) + 8px);top:72px;max-width:42%;background:rgba(30,20,10,.85);border:1px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:13px;display:none;pointer-events:none}
#camB{position:fixed;z-index:6;right:calc(var(--sr) + 10px);top:46%;pointer-events:auto}#camB.on{background:var(--gold);color:#1a1008}#camZ{position:fixed;z-index:6;right:calc(var(--sr) + 10px);top:calc(46% + 56px);display:none;flex-direction:column;gap:6px;pointer-events:auto}
#bIntro{position:fixed;z-index:6;left:50%;top:14%;transform:translateX(-50%);text-align:center;transition:opacity 1s;opacity:0;pointer-events:none;text-shadow:0 2px 8px #000}#bIntro small{display:block;letter-spacing:.3em;color:#e8bd48}#bIntro b{display:block;font:700 34px Georgia,serif}#bIntro span{font-size:18px}
body.bintro #prep,body.bintro #camB{display:none!important}
@media(max-height:430px){.ccb{flex-direction:row}.ccl canvas{width:150px;height:auto}.ccr h2{font-size:20px}.ccs{max-height:40vh}}

#tod,#vig,#wfps{position:fixed;inset:0;pointer-events:none}#tod{z-index:1;transition:background 1.5s}
#vig{z-index:1;display:none;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.34) 100%)}body.g-lit #vig{display:block}
body.g-nowx #wxo{display:none}
#wfps{inset:auto;right:8px;bottom:6px;z-index:3;font:700 11px ui-monospace,monospace;color:#cbd;display:none}body:not(.g-nofps) #wfps:not(:empty){display:block}
body.g-nofps #fps{display:none}

#bAtm{position:fixed;inset:0;pointer-events:none;z-index:1;display:none;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(5,8,16,calc(.28 + var(--dk,0)*.3)) 100%)}
body.sc-b #bAtm{display:block}body.sc-b #tod{display:none}
#bAtm i{position:absolute;inset:-20% -10%;display:none;will-change:transform}
#bAtm.rain i{display:block;background:repeating-linear-gradient(104deg,transparent 0 22px,rgba(210,225,255,.2) 22px 23px,transparent 23px 41px);animation:brain .38s linear infinite}
#bAtm.rain i+i{background:repeating-linear-gradient(104deg,transparent 0 37px,rgba(230,240,255,.16) 37px 38px,transparent 38px 63px);animation-duration:.55s;animation-delay:-.2s}
#bAtm.rain{background-color:rgba(40,55,80,.12)}
@keyframes brain{from{transform:translate(0,-60px)}to{transform:translate(-24px,40px)}}
#bAtm.snow i{display:block;background:radial-gradient(circle,rgba(255,255,255,.9) 0 1.6px,transparent 2.2px) 0 0/46px 52px,radial-gradient(circle,rgba(255,255,255,.7) 0 1.1px,transparent 1.8px) 17px 23px/31px 37px;animation:bsnow 7s linear infinite}
#bAtm.snow i+i{background:radial-gradient(circle,rgba(255,255,255,.55) 0 2.6px,transparent 3.4px) 5px 9px/83px 71px;animation-duration:11s;filter:blur(.6px)}
@keyframes bsnow{from{transform:translate(0,-52px)}to{transform:translate(-30px,0)}}
#bAtm.fog i{display:block;background:radial-gradient(ellipse 40% 55% at 30% 50%,rgba(220,228,235,.26),transparent 70%),radial-gradient(ellipse 45% 50% at 75% 40%,rgba(220,228,235,.22),transparent 70%);animation:bfog 26s ease-in-out infinite alternate}
#bAtm.fog i+i{animation-duration:38s;animation-direction:alternate-reverse;opacity:.8}
@keyframes bfog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}

function xHub(){const x=G.X;const items=[['xsg','1-3 Kuşatma & esirler'],['xown','4-5 Mülkler & vassallar'],['xtax','7 Vergi'],['xdip','6 İttifak & diplomasi'],['xspy','8-9 Haber ağı & sis'],['xsea','10-11 Mevsim & hava'],['xcraft','13-14 Atölye & zırh'],['xhors','15 At yetiştirme'],['xcmd','16-17 Emir & pusu'],['xperk','18 Kahraman yetenekleri'],['xcmp','19-20 Yoldaşlar'],['xduel','21 Turnuva & düello'],['xq','22 Görev panosu'],['xnav','23 Donanma'],['xmin','27 Bakanlar'],['xbnr','28 Sancaktar'],['xchr','29 Tarih defteri'],['xmod','30 Paylaş & mod']];
 xp('Yönetim',`${SEAS[xSeason()]} · ${WXN[x.wx]} · Gün ${G.day+1}`,`<div class="acts">${items.map(i=>xb(i[0],i[1])).join('')}</div>`,0)}
ACT.xhub=()=>xHub();
// --- 1-3,25 kuşatma ---
const xGar=s=>80+(s.sd%60)+(s.cap?260:s.town?70:110);
function xAP(){let p=0;for(const s of G.stacks){const t=TROOPS[s.id];p+=(s.count-s.wounded)*(1+t.tier*.55)}const g=G.X.sg;return p*(1+.25*Math.min(1,g[0])+.2*Math.min(1,g[1])+.25*Math.min(1,g[2]))}
function xTown(s){if(!G.X)return'';let h='';const x=G.X,i=xi(s);
 if((s.castle||s.town)&&s.nat!==G.nat&&atWar(G.nat,s.nat)){const gs=Math.round(x.siege&&x.siege.i===i?x.siege.gs:xGar(s));h+=xb('xbegin',x.siege&&x.siege.i===i?'Kuşatma sürüyor':'Kuşat',`garnizon ${gs} · gücün ${Math.round(xAP())}`,x.siege&&x.siege.i===i,`data-i="${i}"`)}
 if(s.mine||s.pl)h+=xb('xown','Mülklerim');
 if(s.town)h+=xb('xq','Görev panosu')+xb('xcmp','Yoldaş ara')+xb('xduel','Turnuva & düello')+xb('xcraft','Atölye & malzeme');
 if(s.port)h+=xb('xnav','Tersane & deniz baskını');
 return h+xNpcBtn(s)+xb('xhub','Yönetim')}
ACT.xsg=()=>{const x=G.X,g=x.sg;let b=`<p class="note">Kuşatma aletleri kuşatmada gücü artırır (her türden 1 yeter). Atölyeden üret.</p><div class="list"><div class="row">Koçbaşı ×${g[0]} · Mancınık ×${g[1]} · Kule ×${g[2]}</div></div><h3 style="margin:8px 0;font-size:15px">Esir lordlar</h3><div class="list">`;
 b+=x.lp.length?x.lp.map((l,j)=>`<div class="row"><b>${l.name}</b> (${NATIONS[l.nat].k}) <span class="note">fidye ${l.r}</span>${xb('xrans','Fidye al','',0,`data-j="${j}"`)}${xb('xfree','Serbest bırak','',0,`data-j="${j}"`)}</div>`).join(''):'<p class="note">Esir lord yok.</p>';
 xp('Kuşatma & esirler',x.siege?`Süren kuşatma: ${W.setl[x.siege.i].name}`:'Savaştaki düşman kale/şehirlerde Kuşat düğmesi çıkar.',b+'</div>')};
ACT.xbegin=d=>{const x=G.X,s=W.setl[+d.i];if(x.siege&&x.siege.i===+d.i)return;if(!troopCount()){toast('Ordun yok');return}x.siege={i:+d.i,gs:xGar(s),d:0};wmsg(`${s.name} kuşatıldı!`);xChr(`${s.name} kuşatıldı`);closePanel()};
function xSiegeDaily(){const x=G.X,sg=x.siege;if(!sg)return;const s=W.setl[sg.i];if(!s||s.nat===G.nat||!atWar(G.nat,s.nat)){x.siege=null;return}
 if(Math.hypot(P.x-s.x,P.y-s.y)>4500){wmsg('Kuşatma bozuldu: ordu uzaklaştı.',1);x.siege=null;return}
 const ap=xAP();sg.d++;sg.gs-=ap*.12;const loss=Math.max(1,Math.floor(troopCount()*.02));if(G.stacks.length)removeTroop(G.stacks[G.stacks.length-1].id,Math.min(loss,G.stacks[G.stacks.length-1].count));G.food=Math.max(0,G.food-1);
 if(sg.gs<=0){x.siege=null;xChr(`${s.name} kuşatma ile alındı`);const pl=`<p class="note">${s.name} düştü. Ne yapacaksın?</p><div class="acts">${xb('xcap','Yağmala',' +gold, sadakat düşük',0,`data-i="${sg.i}" data-m="0"`)}${xb('xcap','Koru',' sadakat yüksek, Onur +',0,`data-i="${sg.i}" data-m="1"`)}</div>`;xp('Kale düştü',s.name,pl,0)}
 else if(!troopCount()||sg.d>40){wmsg('Kuşatma başarısız.',1);x.siege=null}}
ACT.xcap=d=>{const x=G.X,s=W.setl[+d.i],m=+d.m;const old=s.nat;if(G.kd){s.kd=1}s.nat=G.nat;s.pl=1;if(!x.own.includes(+d.i))x.own.push(+d.i);x.loy[+d.i]=m?70:30;
 if(m){G.rep[0]++;G.rep[1]++}else{G.gold+=300+(s.sd%200);G.rep[2]+=2}
 const l=W.parties.find(p=>p.kind==='lord'&&p.nat===old&&!p.dead);if(l&&x.lp.length<6){x.lp.push({name:l.name,nat:old,r:200+(s.sd%300)});wmsg(`${l.name} esir alındı!`)}
 terrCheck();W.tiles.clear();W.tv++;closePanel()};
ACT.xrans=d=>{const x=G.X,l=x.lp.splice(+d.j,1)[0];if(l){G.gold+=l.r;G.X.ally;toast(`Fidye: +${l.r}`);G.rel[0]+=0}ACT.xsg()};
ACT.xfree=d=>{const x=G.X,l=x.lp.splice(+d.j,1)[0];if(l){G.rep[0]+=2;G.rep[1]+=2;toast('Lord serbest bırakıldı, onurun arttı')}ACT.xsg()};
// --- 4,5,24,26,7 mülkler ---
ACT.xown=()=>{const x=G.X;const L=x.own.slice();if(vSetl&&!L.includes(xi(vSetl)))L.unshift(xi(vSetl));
 let b=L.length?'<div class="list">':'<p class="note">Henüz mülkün yok. Kuşatmayla kale/şehir al ya da köy kur.</p>';
 for(const i of L){const s=W.setl[i];if(!s)continue;const bl=x.bl[i]||[],loy=Math.round(x.loy[i]==null?70:x.loy[i]),v=x.vas[i];
  b+=`<div class="row" style="flex-wrap:wrap"><b>${s.name}</b> <span class="note">sadakat ${loy} · ${bl.map(k=>XBLD[k][0]).join(', ')||'bina yok'}${v?' · vassal '+v.nm:''}</span><div class="acts" style="width:100%">${XBLD.map((b2,k)=>bl.includes(k)?'':xb('xbld',b2[0],b2[1],G.gold<b2[1],`data-i="${i}" data-k="${k}"`)).join('')}${xb('xfest','Bayram','200 altın',G.gold<200,`data-i="${i}"`)}${v?'':xb('xfief','Tımar ver','vassal',G.gold<0,`data-i="${i}"`)}</div></div>`}
 xp('Mülkler & vassallar','Binalar günlük etki verir; bayram ve tapınak sadakati yükseltir. Tımar verilen mülk vergisinin %40\'ını öder, haftalık asker yollar.',b+(L.length?'</div>':''))};
ACT.xbld=d=>{const x=G.X,k=+d.k,i=+d.i;if(G.gold<XBLD[k][1])return;G.gold-=XBLD[k][1];(x.bl[i]=x.bl[i]||[]).push(k);xChr(`${W.setl[i].name}: ${XBLD[k][0]} yapıldı`);ACT.xown()};
ACT.xfest=d=>{if(G.gold<200)return;G.gold-=200;G.X.loy[+d.i]=Math.min(100,(G.X.loy[+d.i]==null?70:G.X.loy[+d.i])+15);G.rep[0]++;ACT.xown()};
const VN=['Kadir','Berk','Aras','Doruk','Emir','Sinan','Taner'];
ACT.xfief=d=>{const i=+d.i;G.X.vas[i]={nm:VN[i%VN.length]+' Bey',loy:60};G.X.loy[i]=Math.min(100,(G.X.loy[i]==null?70:G.X.loy[i])+10);xChr(`${W.setl[i].name} tımarı ${G.X.vas[i].nm}'e verildi`);ACT.xown()};
ACT.xtax=()=>{const x=G.X;xp('Vergi',`Şu an: ${['Düşük','Normal','Yüksek'][x.tax]}`,`<p class="note">Düşük: gelir ×0.6, sadakat +1/gün. Normal: gelir ×1. Yüksek: gelir ×1.5, sadakat −1/gün.</p><div class="acts">${[0,1,2].map(k=>xb('xsett',['Düşük','Normal','Yüksek'][k],x.tax===k?'(seçili)':'',0,`data-k="${k}"`)).join('')}</div>`)};
ACT.xsett=d=>{G.X.tax=+d.k;ACT.xtax()};
function xOwnDaily(){const x=G.X,m=[.6,1,1.5][x.tax];let inc=0;
 for(const i of x.own.slice()){const s=W.setl[i];if(!s||s.nat!==G.nat){x.own.splice(x.own.indexOf(i),1);continue}const bl=x.bl[i]||[];let loy=x.loy[i]==null?70:x.loy[i];
  let g=(s.castle?6:s.town?12:3)*m+(bl.includes(0)?6:0);if(xPerk(7))g*=1.2;const v=x.vas[i];if(v){g*=.6;if(G.day%7===0&&troopCount()<maxParty()){addTroop(G.nat*6,2);wmsg(`${v.nm} 2 asker yolladı.`)}v.loy=Math.max(0,Math.min(100,v.loy+(x.tax===0?1:x.tax===2?-1:0)))}
  inc+=g;loy+=(x.tax===0?1:x.tax===2?-1:0)+(bl.includes(4)?1:0)-(G.morale<20?1:0);if(bl.includes(1)&&G.day%3===0)s.vol=Math.min(14,(s.vol||0)+2);x.loy[i]=Math.max(0,Math.min(100,loy));
  if(x.loy[i]<12||(v&&v.loy<8)){const e=[0,1,2,3,4].filter(n=>n!==G.nat)[G.day%4];s.nat=e;s.pl=0;s.kd=0;x.own.splice(x.own.indexOf(i),1);wmsg(`${s.name} isyan etti ve ${NATIONS[e].k} tarafına geçti!`,1);xChr(`${s.name} isyan etti`);terrCheck();W.tiles.clear();W.tv++}}
 G.gold+=Math.round(inc)}
// --- 6,27 diplomasi & bakanlar ---
ACT.xdip=()=>{const x=G.X;let b='<div class="acts">';for(let e=0;e<5;e++){if(e===G.nat)continue;b+=x.ally[e]?`<div class="row"><b>${NATIONS[e].k}</b> müttefik</div>`:atWar(G.nat,e)?xb('xpeace',`${NATIONS[e].k}: barış iste`,'300 altın',G.gold<300,`data-e="${e}"`):xb('xally',`${NATIONS[e].k}: evlilik ittifakı`,'800 altın',G.gold<800,`data-e="${e}"`)}
 xp('İttifak & diplomasi','İttifak uzun ateşkes sağlar; müttefik krallıkla savaşa girmezsin.',b+'</div>')};
ACT.xpeace=d=>{if(G.gold<300)return;G.gold-=300;makePeace(G.nat,+d.e);xChr(`${NATIONS[+d.e].k} ile barış`);ACT.xdip()};
ACT.xally=d=>{const e=+d.e;if(G.gold<800)return;G.gold-=800;G.X.ally[e]=1;PL.truce[G.nat][e]=9000;PL.truce[e][G.nat]=9000;G.rep[0]+=2;xChr(`${NATIONS[e].k} ile evlilik ittifakı`);wmsg(`${NATIONS[e].n} ile ittifak kuruldu.`);ACT.xdip()};
ACT.xmin=()=>{const x=G.X;let b='<div class="list">';for(const [k,n,d] of MINN){const c=x.min[k];b+=`<div class="row"><b>${n}</b> <span class="note">${d}</span><div class="acts">${x.cmp.map(cc=>xb('xmset',COMP[cc.k].n,'',c===cc.k,`data-m="${k}" data-c="${cc.k}"`)).join('')||'<span class="note">Önce yoldaş tut</span>'}${c>=0?xb('xmset','Boşalt','',0,`data-m="${k}" data-c="-1"`):''}</div></div>`}
 xp('Bakanlar','Her bakan günde 14 altın maaş alır. Aynı yoldaş iki göreve atanamaz.',b+'</div>')};
ACT.xmset=d=>{const x=G.X,c=+d.c;if(c>=0)for(const k in x.min)if(x.min[k]===c)x.min[k]=-1;x.min[d.m]=c;ACT.xmin()};
// --- 8,9,10,11,12 ---
ACT.xspy=()=>{const x=G.X,full=xCmp(4)?1:0,n=full?99:3*x.spy;let b=`<p class="note">Casus: ${x.spy}/5 (150 altın). Görüş: ${Math.round(xVis()/35)} birim. Sis ${x.fog?'açık':'kapalı'}.</p><div class="acts">${xb('xspyb','Casus tut','150 altın',x.spy>=5||G.gold<150)}${xb('xfog',x.fog?'Sisi kapat':'Sisi aç')}</div><h3 style="margin:8px 0;font-size:15px">Lord ordular</h3><div class="list">`;
 const L=W.parties.filter(p=>p.kind==='lord'&&!p.dead).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y)).slice(0,n);
 b+=L.length?L.map(p=>{const s=W.setl.reduce((a,t)=>Math.hypot(t.x-p.x,t.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?t:a,W.setl[0]);return`<div class="row"><b>${p.name}</b> <span class="note">${NATIONS[p.nat].k} · ${s.name} yakını · ${Math.round(Math.hypot(p.x-P.x,p.y-P.y)/35)} birim · güç ${Math.round(partyStr(p))}</span></div>`}).join(''):'<p class="note">Casus tutmadan haber alınamaz.</p>';
 xp('Haber ağı & sis',`Görüş menzili dışındaki ordular haritada gizlenir.`,b+'</div>')};
ACT.xspyb=()=>{if(G.X.spy>=5||G.gold<150)return;G.gold-=150;G.X.spy++;ACT.xspy()};ACT.xfog=()=>{G.X.fog^=1;ACT.xspy()};
const xVis=()=>(5000+G.X.spy*1500+(xCmp(1)?2500:0))*(G.X.wx===2?.6:1);
function xSee(p){const x=G.X;if(!x||!x.fog||(p.kind!=='lord'&&p.kind!=='bandit'))return true;if(p.camp)return true;const r=xVis();if(Math.hypot(p.x-P.x,p.y-P.y)<r)return true;for(const i of x.own){const s=W.setl[i];if(s&&Math.hypot(p.x-s.x,p.y-s.y)<r*.7)return true}return false}
ACT.xsea=()=>{const x=G.X;xp('Mevsim & hava',`${SEAS[xSeason()]}, ${WXN[x.wx]}`,`<p class="note">Kış: yürüyüş −10%, yemek daha çok gider. Yaz: köy geliri artar. Sonbahar: hasat yemek getirir. Yağmur/kar: okçular %12 zayıf, hız düşer. Sis: görüş ve okçu menzili azalır. Salgın ve kıtlık rastgele çıkar; hastane ve şifacı kaybı azaltır.</p>`)};
function xWxDaily(){const x=G.X,s=xSeason(),r=Math.random();const w=r<.6?0:r<.8?(s===3?3:1):r<.9?2:(s===3?3:0);if(w!==x.wx){x.wx=w;if(w)wmsg(`Hava: ${WXN[w]}`)}
 const o=$('wxo');if(o){o.className=['','rain','fog','snow'][w]}if(G.day%30===0){wmsg(`${SEAS[s]} başladı.`);xChr(`${SEAS[s]} başladı`)}
 if(s===3&&G.day%2===0)G.food=Math.max(0,G.food-1);if(s===1&&V)G.gold+=3*V.lv;if(s===2&&V&&G.day%30===10)G.food+=10*V.lv;
 if(Math.random()<.012)xPlague();else if(Math.random()<.01)xFamine()}
function xPlague(){const hosp=xCmp(0)||Object.values(G.X.bl).some(b=>b.includes(2));const n=troopCount();if(n<4)return;const l=Math.max(1,Math.floor(n*(hosp?.03:.08)));xChr('Salgın çıktı');openPanel(`<h2>Salgın!</h2><div class="sub">Ordunda hastalık yayılıyor. Tahmini kayıp: ${l} asker.</div><div class="acts">${xb('xplg','Karantina','150 altın',G.gold<150,`data-l="${Math.max(1,Math.floor(l/3))}" data-c="150"`)}${xb('xplg','Kaderine bırak','',0,`data-l="${l}" data-c="0"`)}</div>`)}
ACT.xplg=d=>{G.gold-=+d.c;let l=+d.l;for(const s of G.stacks.slice()){if(l<=0)break;const k=Math.min(s.count,Math.ceil(l/2));removeTroop(s.id,k);l-=k}wmsg('Salgın atlatıldı.',1);closePanel()};
function xFamine(){xChr('Kıtlık');openPanel(`<h2>Kıtlık</h2><div class="sub">Kırsalda ürün kurudu; erzak fiyatı uçtu.</div><div class="acts">${xb('xfam','Erzak al','200 altın: +25 yemek',G.gold<200,'data-b="1"')}${xb('xfam','Kıtlığı göze al','yemek −%40',0,'data-b="0"')}</div>`)}
ACT.xfam=d=>{if(+d.b){G.gold-=200;G.food+=25}else G.food=Math.floor(G.food*.6);closePanel()};
// --- 13,14,15 atölye ---
const xMP=k=>Math.round(MATB[k]*(.7+.8*((Math.sin(G.day/17+k*2)+1)/2))*(xCmp(5)?.75:1));
ACT.xcraft=()=>{const x=G.X;let b=`<div class="list"><div class="row">Demir ${x.mat[0]} · Tahta ${x.mat[1]} · Deri ${x.mat[2]}</div></div><h3 style="margin:6px 0;font-size:15px">Malzeme (fiyat dalgalanır)</h3><div class="acts">${[0,1,2].map(k=>xb('xmat',`${MATN[k]} ×5`,`${xMP(k)*5} altın`,G.gold<xMP(k)*5,`data-k="${k}"`)).join('')}</div>`;
 const rec=[['Koçbaşı',[0,4,1],'a0',0],['Mancınık',[3,3,0],'a1',1],['Kuşatma kulesi',[2,6,0],'a2',2]];b+=`<h3 style="margin:6px 0;font-size:15px">Kuşatma aletleri</h3><div class="acts">`;
 for(const [n,c,a,i] of rec){const q=[c[2]===undefined?0:0];const ok=x.mat[0]>=(i===0?1:i===1?3:2)&&x.mat[1]>=(i===0?4:i===1?3:6);b+=xb('xmk',`${n} (${x.sg[i]})`,`${i===0?'4 tahta 1 demir':i===1?'3 tahta 3 demir':'6 tahta 2 demir'}`,!ok,`data-i="${i}"`)}
 b+=`</div><h3 style="margin:6px 0;font-size:15px">Zırh (kahraman ve ordu)</h3><div class="acts">${ARMN.map((n,k)=>{const lv=x.arm[k],c=[[2,0,1],[3,0,2],[1,0,2]][k];return xb('xarm',`${n} sv.${lv}/3`,`${c[0]*(lv+1)} demir ${c[2]*(lv+1)} deri`,lv>=3||x.mat[0]<c[0]*(lv+1)||x.mat[2]<c[2]*(lv+1),`data-k="${k}"`)}).join('')}</div>`;
 xp('Atölye & zırh','Ham madde al, kuşatma aleti ve zırh üret.',b)};
ACT.xmat=d=>{const k=+d.k,p=xMP(k)*5;if(G.gold<p)return;G.gold-=p;G.X.mat[k]+=5;ACT.xcraft()};
ACT.xmk=d=>{const x=G.X,i=+d.i,c=[[1,4],[3,3],[2,6]][i];if(x.mat[0]<c[0]||x.mat[1]<c[1])return;x.mat[0]-=c[0];x.mat[1]-=c[1];x.sg[i]++;xChr('Kuşatma aleti yapıldı');ACT.xcraft()};
ACT.xarm=d=>{const x=G.X,k=+d.k,lv=x.arm[k],c=[[2,1],[3,2],[1,2]][k];if(x.mat[0]<c[0]*(lv+1)||x.mat[2]<c[1]*(lv+1))return;x.mat[0]-=c[0]*(lv+1);x.mat[2]-=c[1]*(lv+1);x.arm[k]++;ACT.xcraft()};
ACT.xhors=()=>{const x=G.X;xp('At yetiştirme',`Mevcut: ${HORN[x.hor]} (hız +%${x.hor*3})`,`<p class="note">${x.hbr>0?`Yetiştirme sürüyor: ${x.hbr} gün kaldı.`:x.hor>=3?'En iyi cins elinde.':'Bir üst cins için 400 altın, 8 gün.'}</p><div class="acts">${xb('xhbr','Yetiştir','400 altın',x.hbr>0||x.hor>=3||G.gold<400)}</div>`)};
ACT.xhbr=()=>{G.gold-=400;G.X.hbr=8;ACT.xhors()};
// --- 16,17 emir ---
ACT.xcmd=()=>{const x=G.X,cd=G.day-x.ambT;xp('Emir & pusu',`Tutum: ${['Saldırgan','Dengeli','Savunmacı'][x.cmd]}`,`<p class="note">Saldırgan: ateş serbest, saldırı +%10, can −%5. Savunmacı: can +%12, saldırı −%5. Pusu: bir sonraki savaşta düşman canı −%12 (3 günde bir).</p><div class="acts">${[0,1,2].map(k=>xb('xcs',['Saldırgan','Dengeli','Savunmacı'][k],x.cmd===k?'(seçili)':'',0,`data-k="${k}"`)).join('')}${xb('xamb',x.amb?'Pusu hazır':'Pusu hazırla','',x.amb||cd<3)}</div>`)};
ACT.xcs=d=>{G.X.cmd=+d.k;ACT.xcmd()};ACT.xamb=()=>{G.X.amb=1;ACT.xcmd()};

ACT.xperk=()=>{const x=G.X,pts=G.hero.lvl-1-x.perk.length;let b='';for(let r=0;r<3;r++){b+=`<h3 style="margin:6px 0;font-size:15px">${PBR[r]}</h3><div class="acts">`+[0,1,2].map(k=>{const i=r*3+k;return xb('xpk',PERKS[i][0],PERKS[i][1],xPerk(i)||pts<=0,`data-i="${i}"`)}).join('')+'</div>'}

  if(G.day-c.ev>=25&&Math.random()<.2&&!document.querySelector('#ov:not(.hide)')){c.ev=G.day;const e=CEV[G.day%3];xChr(`${COMP[c.k].n}: ${e[0]}`);openPanel(`<h2>${COMP[c.k].n}</h2><div class="sub">${COMP[c.k].n} ${e[0]}.</div><div class="acts">${xb('xce','Kabul: '+e[1],'',G.gold<e[3],`data-k="${c.k}" data-c="${e[3]}" data-y="1"`)}${xb('xce',e[2],'',0,`data-k="${c.k}" data-c="0" data-y="0"`)}</div>`)}}
 if(xCmp(0)){for(const s of G.stacks)s.wounded=Math.max(0,s.wounded-1)}if(xCmp(6))G.hero.xp+=2;if(Object.values(x.bl).some(b=>b.includes(3)))G.hero.xp+=2;if(xCmp(2))G.gold+=6}

function xDaily(){if(!G.X)xInit();const x=G.X;xWxDaily();xSiegeDaily();xOwnDaily();xCmpDaily();xQDaily();
 if(xPerk(1)||x.bnr)G.morale=Math.min(100,G.morale+(xPerk(1)?.5:0)+(x.bnr?.5:0));if(xPerk(2))G.food+=Math.floor(troopCount()/30);if(xPerk(6))G.gold+=4;if(xPerk(8)&&V)G.gold+=5;
 if(x.hbr>0){x.hbr--;if(!x.hbr){x.hor=Math.min(3,x.hor+1);wmsg(`Yeni at cinsi: ${HORN[x.hor]}`)}}
 if(x.min.fin>=0)G.gold+=6;if(x.min.war>=0)G.gold-=14;if(x.min.dip>=0){G.gold-=14;if(G.day%10===0&&Math.random()<.3){const e=[0,1,2,3,4].find(n=>n!==G.nat&&atWar(G.nat,n));if(e!=null){makePeace(G.nat,e);xChr(`${NATIONS[e].k} ile barış sağlandı`)}}}

const HEXP=['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9','#8e44ad','#ecf0f1','#2c3e50','#7f5539','#e84393'];
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const SHAPES=['Dikdörtgen','Çatal','Sivri'],EMBS=['Yıldız','Hilal','Haç','Taç','Kule','Güneş'];
const IDEO=[
 {n:'Tüccar Cumhuriyeti',d:'Her gün +5 altın ve köy seviyesi başına +3 altın gelir.'},
 {n:'Savaşçı Beylik',d:'Eğitim kampında talim %40 hızlı; her gün moral +0.3.'},
 {n:'Adalet Meclisi',d:'Haftada bir Onur şöhreti +1; köy nüfusu daha hızlı artar.'},
 {n:'Deniz Beyliği',d:'Kıyı köyünden her gün +8 altın; limanlı yerleşimler ucuza geçinir (+1 yemek).'},
 {n:'Kutsal Tarikat',d:'Her gün moral +0.6 ve +1 yemek; kampta talim %10 hızlı.'}];
function drawBannerC(g,x,y,w,h,f){const c1=HEXP[f.c1],c2=HEXP[f.c2];g.save();g.translate(x,y);g.strokeStyle='#3a2a1a';g.lineWidth=Math.max(1,w*.08);g.beginPath();g.moveTo(0,0);g.lineTo(0,h*1.25);g.stroke();
 g.fillStyle=c1;g.beginPath();if(f.shape===1){g.moveTo(0,0);g.lineTo(w,0);g.lineTo(w*.72,h*.5);g.lineTo(w,h);g.lineTo(0,h)}else if(f.shape===2){g.moveTo(0,0);g.lineTo(w,0);g.lineTo(w,h*.6);g.lineTo(w/2,h);g.lineTo(0,h*.6)}else{g.rect(0,0,w,h)}g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=Math.max(.6,w*.05);g.stroke();
 g.fillStyle=c2;g.strokeStyle=c2;const cx=w*.46,cy=h*.4,r=Math.min(w,h)*.26;g.lineWidth=Math.max(.8,r*.35);
 switch(f.emb){case 0:g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;g.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}g.fill();break;
 case 1:g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.fillStyle=c1;g.beginPath();g.arc(cx+r*.45,cy,r*.85,0,7);g.fill();break;
 case 2:g.beginPath();g.moveTo(cx,cy-r);g.lineTo(cx,cy+r);g.moveTo(cx-r*.8,cy-r*.2);g.lineTo(cx+r*.8,cy-r*.2);g.stroke();break;
 case 3:g.beginPath();g.moveTo(cx-r,cy+r*.7);g.lineTo(cx-r,cy-r*.5);g.lineTo(cx-r*.5,cy+r*.1);g.lineTo(cx,cy-r*.8);g.lineTo(cx+r*.5,cy+r*.1);g.lineTo(cx+r,cy-r*.5);g.lineTo(cx+r,cy+r*.7);g.closePath();g.fill();break;
 case 4:g.fillRect(cx-r*.6,cy-r*.3,r*1.2,r*1.1);for(let i=-1;i<=1;i++)g.fillRect(cx+i*r*.5-r*.15,cy-r*.8,r*.3,r*.5);break;
 default:g.beginPath();g.arc(cx,cy,r*.55,0,7);g.fill();for(let i=0;i<8;i++){const a=i*Math.PI/4;g.beginPath();g.moveTo(cx+Math.cos(a)*r*.7,cy+Math.sin(a)*r*.7);g.lineTo(cx+Math.cos(a)*r*1.1,cy+Math.sin(a)*r*1.1);g.stroke()}}
 g.restore()}
// ---- Eğitim kampı ----
const tcCap=c=>20*c.lv,tcNear=c=>Math.hypot(P.x-c.x,P.y-c.y)<2200;
function trainDaily(){if(!G.tc||!G.tc.length)return;const sav=(G.kd&&G.kd.ideo===1?1.4:G.kd&&G.kd.ideo===4?1.1:1)*(G.X&&xCmp(7)?1.15:1)*(G.X&&G.X.min.war>=0?1.15:1);
 for(const c of G.tc){const tot=c.st.reduce((a,s)=>a+s.count,0);if(!tot)continue;const need=Math.max(1,Math.floor(tot/5));
  if(G.food<need){wmsg(`${c.name}: yemek yok, talim durdu.`,1);continue}G.food-=need;let up=0;
  for(const s of c.st.slice()){const t=TROOPS[s.id];s.days=(s.days||0)+1;if(!t.ups.length)continue;s.xp+=s.count*(5+3*c.lv)*sav;
   while(s.xp>=t.xpUp&&s.count>0){s.xp-=t.xpUp;s.count--;up++;const to=t.ups[0];let d=c.st.find(q=>q.id===to);if(!d){d={id:to,count:0,xp:0,days:s.days};c.st.push(d)}d.count++}}
  c.st=c.st.filter(s=>s.count>0);if(up)wmsg(`${c.name}: ${up} asker talimde terfi etti.`)}}
function kdDaily(){trainDaily();const k=G.kd;if(!k)return;const i=k.ideo,lv=V?V.lv:1;
 if(i===0)G.gold+=5+lv*3;if(i===1)G.morale=Math.min(100,G.morale+.3);if(i===2){if(G.day%7===0&&G.rep)G.rep[0]++;if(V&&G.day%5===0)V.pop+=1}
 if(i===3&&V&&V.sea)G.gold+=8;if(i===3||i===4)G.food+=1;if(i===4)G.morale=Math.min(100,G.morale+.6)}
function drawTrainCamps(g,z){if(!G)return;if(G.kd&&vSetl&&!vSetl.kd){vSetl.kd=1;NT[6]=G.kd.col;terrCheck()}
 if(G.tc&&z>=.04){const k=Math.min(1.3,Math.max(.7,z*1.5))/z;for(const c of G.tc){g.save();g.translate(c.x,c.y);g.scale(k,k);
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,9,24,6,0,0,7);g.fill();
  const tn=(x,s,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(x-12*s,8);g.lineTo(x,-14*s);g.lineTo(x+12*s,8);g.closePath();g.fill();g.strokeStyle='#2a1a0a';g.lineWidth=1.2;g.stroke();g.fillStyle='#2a1a0a';g.beginPath();g.moveTo(x-2.5*s,8);g.lineTo(x,-2*s);g.lineTo(x+2.5*s,8);g.fill()};
  tn(-9,.8,'#b89a6a');tn(9,1,'#d9c08c');g.strokeStyle='#5a4028';g.lineWidth=1.5;g.beginPath();g.moveTo(22,8);g.lineTo(22,-20);g.stroke();
  const f=G.kd?G.kd:{c1:NATIONS[G.nat]?2:0,c2:6,shape:0,emb:2};drawBannerC(g,22,-20,13,10,f);
  g.strokeStyle='#6b4a28';g.lineWidth=1.4;g.beginPath();g.moveTo(-26,10);g.lineTo(-18,3);g.moveTo(-18,10);g.lineTo(-26,3);g.stroke();
  if(z>=.12){g.font='700 10px sans-serif';g.textAlign='center';g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.7)';g.fillStyle='#fff';g.strokeText(c.name,0,22);g.fillText(c.name,0,22)}g.restore()}}
 if(G.kd&&vSetl&&z>=.12){const k=Math.min(1.3,Math.max(.7,z*1.5))/z;g.save();g.translate(vSetl.x,vSetl.y-8/z*0);g.scale(k,k);drawBannerC(g,16,-36,12,16,G.kd);g.restore()}}
function trainOpen(i){const c=G.tc[i];if(!c){openTrain();return}const tot=c.st.reduce((a,s)=>a+s.count,0),cap=tcCap(c),near=tcNear(c);
 let h=`<h2>${c.name}</h2><div class="sub">Seviye ${c.lv} · ${tot}/${cap} asker · her gün yemek harcanır, askerler talimle xp kazanır ve otomatik terfi eder${near?'':' · <b style="color:var(--bad)">kampa uzaksın, asker bırakıp alamazsın</b>'}</div><div class="list">`;
 h+=c.st.length?c.st.map((s,j)=>{const t=TROOPS[s.id];return`<div class="row"><b>${t.n}</b> ×${s.count} <span class="note">${s.days||0} gün · xp ${Math.floor(s.xp)}/${t.xpUp||'—'}${t.ups.length?'':' · son kademe'}</span><button class="btn" data-a="tcOut" data-c="${i}" data-j="${j}" ${near?'':'disabled'}>Ordua al</button></div>`}).join(''):'<p class="note">Kampta asker yok.</p>';
 h+=`</div><h3 style="margin:8px 0;font-size:15px">Ordudan gönder</h3><div class="list">`;
 const cand=G.stacks.filter(s=>TROOPS[s.id].ups.length&&s.count-s.wounded>0);
 h+=cand.length?cand.map(s=>{const t=TROOPS[s.id],n=s.count-s.wounded;return`<div class="row"><b>${t.n}</b> ×${n} <button class="btn" data-a="tcIn" data-c="${i}" data-id="${s.id}" data-n="5" ${near?'':'disabled'}>+5</button><button class="btn" data-a="tcIn" data-c="${i}" data-id="${s.id}" data-n="${n}" ${near?'':'disabled'}>Hepsi</button></div>`}).join(''):'<p class="note">Terfi edebilecek sağlam asker yok.</p>';
 h+=`</div><div class="row2">${c.lv<3?`<button class="btn" data-a="tcUp" data-c="${i}">Kampı büyüt (${700*c.lv} altın)</button>`:''}<button class="btn" data-a="tcList">Kamplar</button><button class="btn gold" data-a="close">Kapat</button></div>`;openPanel(h)}
function openTrain(){const nm=`${sName(G.nat,new Set())} Talimhanesi`;let h=`<h2>Eğitim kampları</h2><div class="sub">İstediğin yere kamp kur; askerlerini bırak, her gün talim görüp terfi etsinler. Kampta yemek harcanır, maaş yine ödenir.</div><div class="list">`;

const CG=140;let cgPass=null;const cgW=Math.ceil(MW/CG),cgH=Math.ceil(MH/CG);
function cgInit(){if(cgPass)return;cgPass=new Uint8Array(cgW*cgH);for(let j=0;j<cgH;j++)for(let i=0;i<cgW;i++)cgPass[j*cgW+i]=coastVal(i*CG+CG/2,j*CG+CG/2)>40?1:0}
function cgNear(x,y){cgInit();const ci=Math.min(cgW-1,x/CG|0),cj=Math.min(cgH-1,y/CG|0);if(cgPass[cj*cgW+ci])return[ci,cj];for(let r=1;r<8;r++)for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++){const i=ci+a,j=cj+b;if(i>=0&&j>=0&&i<cgW&&j<cgH&&cgPass[j*cgW+i])return[i,j]}return null}
function bfs(x,y){const s=cgNear(x,y);if(!s)return null;const prev=new Int32Array(cgW*cgH).fill(-2),q=[s[1]*cgW+s[0]];prev[q[0]]=-1;
 for(let h=0;h<q.length;h++){const c=q[h],ci=c%cgW,cj=c/cgW|0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const i=ci+a,j=cj+b;if(i<0||j<0||i>=cgW||j>=cgH)continue;const n=j*cgW+i;if(prev[n]!==-2||!cgPass[n])continue;
  if(a&&b&&(!cgPass[cj*cgW+i]||!cgPass[j*cgW+ci]))continue;prev[n]=c;q.push(n)}}return{prev,s:s[1]*cgW+s[0]}}
function pathTo(B,x,y){const t=cgNear(x,y);if(!t)return null;let c=t[1]*cgW+t[0];if(B.prev[c]===-2)return null;const pts=[];while(c>=0){pts.push([(c%cgW)*CG+CG/2,((c/cgW)|0)*CG+CG/2]);c=B.prev[c]}pts.reverse();
 const out=[];for(let i=0;i<pts.length;i+=2)out.push(pts[i]);out.push(pts[pts.length-1]);out.push([x,y]);return out}
function reachTowns(){const B=bfs(V.x,V.y);if(!B)return[];const r=[];for(const s of W.setl)if(s.town&&!s.mine){const t=cgNear(s.x,s.y);if(t&&B.prev[t[1]*cgW+t[0]]!==-2){const d=Math.hypot(s.x-V.x,s.y-V.y);r.push({id:s.id,d})}}return r.sort((a,b)=>a.d-b.d).slice(0,10)}

function vDaily(){if(!V)return;const f=G.nat;let cap=6+4*(V.b.ev||0);const need=V.pop/8;let eaten=0;
 for(const g of [0,4,1]){const t=Math.min(V.st[g],need-eaten);V.st[g]-=t;eaten+=t;if(eaten>=need-.01)break}
 if(eaten<need-.5){if(V.pop>3){V.pop--;wmsg(`${V.name}'de kıtlık: nüfus azalıyor.`,1)}}else if(V.pop<cap&&Math.random()<.6)V.pop++;
 const pb=prodN(),fw=pb?Math.min(1,(V.pop*.7)/(pb*2)):0,bonus=1+(PL.spouse?.15:0);
 for(const k in BLD){const b=BLD[k];if(b.g===undefined||!V.b[k])continue;V.st[b.g]=Math.min(stCap(),V.st[b.g]+b.out*V.b[k]*fw*bonus)}
 if(vSetl)vSetl.vol=Math.min(12,vSetl.vol+(G.day%2===0?Math.floor(V.pop/15)+0:0));
 if(G.day%7===0){const w=V.cv.reduce((a,c)=>a+c.guards*6,0);if(w){if(G.gold>=w)G.gold-=w;else{G.gold=0;for(const c of V.cv)c.guards=Math.max(0,c.guards-1);wmsg('Kervan muhafızlarının maaşı ödenemedi; biri ayrıldı.',1)}}}
 // baskın
 let near=false;for(const p of W.parties)if(p.kind==='bandit'&&Math.hypot(p.x-V.x,p.y-V.y)<2500){near=true;break}
 if((near&&Math.random()<.05)||(!near&&Math.random()<.01)){const att=8+Math.random()*(15+G.day/18),df=defense();if(att>df){for(let g=0;g<5;g++)V.st[g]=Math.floor(V.st[g]*.65);V.pop=Math.max(3,V.pop-2);plog(`${V.name} haydut baskınına uğradı! Mallar yağmalandı. (saldırı ${Math.round(att)} > savunma ${df})`,1)}else plog(`${V.name}, haydut baskınını püskürttü.`)}
 // evlilik: çocuk
 if(PL.spouse&&G.day%150===0&&PL.kids.length<3){const nm=RN[G.nat][(PL.kids.length+4)%8];PL.kids.push({name:nm,born:G.day});plog(`Ailene yeni bir çocuk katıldı: ${nm}.`)}
 for(const s of W.setl)if(s.mk)for(let g=0;g<5;g++)s.mk[g]*=.9}
// --- kervan ---
const cvName=c=>`Kervan ${c.id}`;
function cvSpawn(c){const p={kind:'caravan',cv:c,name:cvName(c),nat:G.nat,x:c.x,y:c.y,tx:c.x,ty:c.y,spd:28,think:0,troops:[{id:G.nat*6,count:Math.max(1,c.guards)}]};W.parties.push(p);return p}
function cvDispatch(c){const t=W.setl.find(s=>s.id===c.town);if(!t)return false;cgInit();const B=bfs(V.x,V.y);const path=B&&pathTo(B,t.x,t.y);if(!path)return false;
 c.cargo=[0,0,0,0,0];c.profit=0;
 if(c.mode==='sell'){let room=120;for(let g=0;g<5;g++){if(c.good>=0&&c.good!==g)continue;const n=Math.min(V.st[g],room);c.cargo[g]=n;V.st[g]-=n;room-=n}if(!c.cargo.some(n=>n>0.5)){for(let g=0;g<5;g++)V.st[g]+=c.cargo[g];return false}}
 else{const b=Math.min(G.gold,c.budget);if(b<20)return false;G.gold-=b;c.purse=b}
 c.path=path;c.pi=0;c.st='out';c.x=V.x;c.y=V.y;cvSpawn(c);return true}
function cvArrive(p){const c=p.cv,t=W.setl.find(s=>s.id===c.town);
 if(c.st==='out'){let msg='';
  if(c.mode==='sell'){let rev=0;for(let g=0;g<5;g++)if(c.cargo[g]>0){const n=Math.floor(c.cargo[g]);rev+=Math.round(price(t,g)*n*.95);mkAdj(t,g,n*.008)}c.profit=rev;c.cargo=[0,0,0,0,0];msg=`${c.name||cvName(c)} ${t.name}'de mal sattı: ${rev} altın.`}
  else{let left=c.purse;const order=[0,1,2,3,4].filter(g=>c.good<0||c.good===g).sort((a,b)=>price(t,a)/GOODS[a][1]-price(t,b)/GOODS[b][1]);
   for(const g of order){const pr=Math.round(price(t,g)*1.05),n=Math.min(120-c.cargo.reduce((a,b)=>a+b,0),Math.floor(left/pr));if(n>0){c.cargo[g]+=n;left-=n*pr;mkAdj(t,g,-n*.008)}if(c.good<0)break}c.purse=left;msg=`${cvName(c)} ${t.name}'den mal aldı.`}
  wmsg(msg);c.st='back';c.path=c.path.slice().reverse();c.pi=0}
 else{ // eve dönüş
  let m=`${cvName(c)} köye döndü.`;if(c.mode==='sell'){G.gold+=c.profit;m+=` +${c.profit} altın.`;c.profit=0}else{for(let g=0;g<5;g++)V.st[g]=Math.min(stCap(),V.st[g]+c.cargo[g]);G.gold+=Math.floor(c.purse);c.cargo=[0,0,0,0,0];c.purse=0}
  wmsg(m);c.st='home';p.dead=true}}
function cvThink(p,h){const c=p.cv;if(!c||c.dead){p.dead=true;return}
 // saldırı
 for(const q of W.parties){if(q.dead||q===p)continue;if((q.kind==='bandit'||(q.kind==='lord'&&hostileTo(q)))&&Math.abs(q.x-p.x)<26&&Math.abs(q.y-p.y)<26){
  const my=c.guards*3+2,th=partyStr(q)*(.8+Math.random()*.5);
  if(my>=th){q.dead=true;c.guards=Math.max(0,Math.floor(c.guards*.7));wmsg(`${cvName(c)} bir saldırıyı püskürttü.`)}
  else{c.dead=true;p.dead=true;V.cv=V.cv.filter(x=>x!==c);plog(`${cvName(c)} yağmalandı! Daha fazla muhafız tut.`,1);return}}}
 if(!c.path){p.dead=true;return}
 const w=c.path[c.pi];if(!w){cvArrive(p);return}
 if(Math.hypot(w[0]-p.x,w[1]-p.y)<30){c.pi++;if(c.pi>=c.path.length){cvArrive(p);return}}
 const w2=c.path[c.pi];p.tx=w2[0];p.ty=w2[1];p.spd=28;
 const k=Math.round(p.x)+','+Math.round(p.y);if(p.lk===k){p.stuck=(p.stuck||0)+1;if(p.stuck>6){p.x=w2[0];p.y=w2[1];p.stuck=0}}else{p.lk=k;p.stuck=0}
 c.x=p.x;c.y=p.y;p.troops=[{id:G.nat*6,count:Math.max(1,c.guards)}]}
function cvDaily(){if(!V)return;for(const c of V.cv)if(c.st==='home')cvDispatch(c)}
function cvRestore(){for(const c of V.cv)if(c.st!=='home'&&c.path)cvSpawn(c);else c.st='home'}
// --- pazar ---
let mkS=null;
function openMarket(s){mkS=s;let h=`<h2>${s.name} pazarı</h2><div class="sub">Taşıma: ${invN()}/${invCap()} · Altın ${G.gold}</div>`;
 for(let g=0;g<5;g++){const p=price(s,g),have=G.inv[g];h+=`<div style="display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)"><div><b>${GOODS[g][0]}</b> <span class="note">${p} altın · elinde ${have}</span></div><button class="btn" data-a="mBuy" data-g="${g}" ${G.gold>=p&&invN()<invCap()?'':'disabled'}>Al 10</button><button class="btn" data-a="mSell" data-g="${g}" ${have>0?'':'disabled'}>Sat hepsi</button></div>`}
 h+=`<div class="row2"><button class="btn gold" data-a="mBack">Geri</button></div>`;openPanel(h)}
ACT.mBack=()=>openSettlement(mkS);
ACT.mBuy=d=>{const g=+d.g,s=mkS,p=Math.round(price(s,g)*1.05),n=Math.min(10,invCap()-invN(),Math.floor(G.gold/p));if(n<=0)return;G.gold-=p*n;G.inv[g]+=n;mkAdj(s,g,-n*.008);updateRes();openMarket(s)};
ACT.mSell=d=>{const g=+d.g,s=mkS,n=G.inv[g];if(!n)return;const r=Math.round(price(s,g)*n*.95);G.gold+=r;G.inv[g]=0;mkAdj(s,g,n*.008);toast(`${n} ${GOODS[g][0]} sattın: +${r} altın`);updateRes();openMarket(s)};
// --- köy yönetim paneli ---
function openMyVillage(){if(!V){openFound();return}
 const tabs=['Genel','İnşaat','Kervanlar','Aile'];let h=`<h2>★ ${V.name}</h2><div class="sub">Seviye ${V.lv} · nüfus ${Math.floor(V.pop)}/${6+4*(V.b.ev||0)} · savunma ${defense()} · servet ${wealth()}</div><div class="row2" style="justify-content:flex-start;margin:0 0 8px">${tabs.map((t,i)=>`<button class="btn${i===vtab?' gold':''}" data-a="vtab" data-i="${i}">${t}</button>`).join('')}</div>`;
 if(vtab===0){h+=`<div class="sub">Depo (${Math.round(V.st.reduce((a,b)=>a+b,0))}/${stCap()*1}) · yönetici: ${PL.spouse?PL.spouse.name:'yok'}</div>`;
  for(let g=0;g<5;g++)h+=`<div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid var(--line)"><span>${GOODS[g][0]}</span><b>${Math.floor(V.st[g])}</b></div>`;
  h+=`<div class="acts"><button class="btn" data-a="vFood" ${V.st[0]>=1?'':'disabled'}>Tahılı yemeğe çevir <span>+${Math.floor(V.st[0])} yemek</span></button><button class="btn" data-a="vTake" ${invN()<invCap()?'':'disabled'}>Malları yüklen <span>taşıma ${invN()}/${invCap()}</span></button><button class="btn" data-a="vPut" ${invN()>0?'':'disabled'}>Taşıdıklarını depoya koy</button>${vSetl&&vSetl.vol>0?`<button class="btn" data-a="recruit">Gönüllü topla: ${vSetl.vol} <span>kişi başı 10</span></button>`:''}</div>`;
  const nx=V.lv<3;if(nx)h+=`<div class="row2" style="justify-content:flex-start"><button class="btn" data-a="vLevel" ${G.gold>=800*V.lv&&V.pop>=15*V.lv&&(V.b.ev||0)>=2*V.lv?'':'disabled'}>Köyü büyüt: seviye ${V.lv+1} <span>${800*V.lv} altın · nüfus ${15*V.lv} · ev ${2*V.lv}</span></button></div>`}
 else if(vtab===1){h+=`<div class="note">Yapı sayısı ${bTot()}/${bCap()}. Üretim yapıları işçi ister (nüfusun %70'i çalışır).</div>`;
  for(const k in BLD){const b=BLD[k],n=V.b[k]||0,c=bCost(k),lock=b.sea&&!V.sea,full=n>=b.max||bTot()>=bCap();h+=`<div style="display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)"><div><b>${b.n}</b> <span class="note">${n}/${b.max} · ${b.d}${lock?' · kıyı gerekir':''}</span></div><button class="btn" data-a="vBuild" data-k="${k}" ${G.gold>=c&&!full&&!lock?'':'disabled'}>İnşa et <span>${c}</span></button></div>`}}
 else if(vtab===2){const ts=reachTowns();h+=`<div class="note">Kervan 600 altın; muhafız başına 40 altın (haftalık 6 maaş). Kervanlar köy ile seçtiğin şehir arasında otomatik gidip gelir.</div><div class="acts"><button class="btn" data-a="cvNew" ${G.gold>=600&&V.cv.length<4?'':'disabled'}>Yeni kervan kur <span>600</span></button></div>`;
  V.cv.forEach((c,i)=>{const t=W.setl.find(s=>s.id===c.town);h+=`<div style="border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px"><b>${cvName(c)}</b> <span class="note">${c.st==='home'?'köyde':c.st==='out'?'şehre gidiyor':'dönüyor'} · muhafız ${c.guards}</span>
   <div class="acts"><button class="btn" data-a="cvTown" data-i="${i}">Şehir: ${t?t.name:'seç'}</button><button class="btn" data-a="cvMode" data-i="${i}">Mod: ${c.mode==='sell'?'Köy malını sat':'Şehirden gıda/mal getir'}</button><button class="btn" data-a="cvGood" data-i="${i}">Mal: ${c.good<0?'Hepsi':GOODS[c.good][0]}</button>${c.mode==='buy'?`<button class="btn" data-a="cvBud" data-i="${i}">Bütçe: ${c.budget}</button>`:''}<button class="btn" data-a="cvGuard" data-i="${i}" ${G.gold>=40&&c.guards<15?'':'disabled'}>Muhafız +1 <span>40</span></button></div></div>`});
  if(!ts.length)h+=`<div class="note" style="color:var(--bad)">Köyünden karayla ulaşılabilen şehir yok.</div>`}
 else{const sp=PL.spouse;h+=sp?`<div class="sub">Eşin: <b>${sp.name}</b> (${NATIONS[sp.nat].n}) · köy üretimi +%15, savunma +5</div>`:`<div class="note">Henüz evli değilsin. Şehirlerin meyhanesinde ve başkentte evlenme adayları bulunur (Şövalye rütbesi gerekir).</div>`;
  h+=PL.kids.length?`<div class="sub">Çocuklar: ${PL.kids.map(k=>k.name).join(', ')}</div>`:''}
 h+=`<div class="row2"><button class="btn gold" data-a="close">Kapat</button></div>`;openPanel(h)}
ACT.myVillage=()=>openMyVillage();ACT.market=()=>openMarket(curSetl);
ACT.vtab=d=>{vtab=+d.i;openMyVillage()};
ACT.vFood=()=>{const n=Math.floor(V.st[0]);V.st[0]-=n;G.food+=n;toast(`+${n} yemek`);updateRes();openMyVillage()};
ACT.vTake=()=>{let room=invCap()-invN();for(let g=0;g<5&&room>0;g++){const n=Math.min(Math.floor(V.st[g]),room);G.inv[g]+=n;V.st[g]-=n;room-=n}openMyVillage()};
ACT.vPut=()=>{for(let g=0;g<5;g++){const n=Math.min(G.inv[g],stCap()-V.st[g]);if(n>0){V.st[g]+=n;G.inv[g]-=n}}openMyVillage()};
ACT.vLevel=()=>{const c=800*V.lv;if(G.gold<c)return;G.gold-=c;V.lv++;plog(`${V.name} büyüdü: seviye ${V.lv}.`);updateRes();openMyVillage()};
ACT.vBuild=d=>{const k=d.k,c=bCost(k);if(G.gold<c||(V.b[k]||0)>=BLD[k].max||bTot()>=bCap())return;G.gold-=c;V.b[k]=(V.b[k]||0)+1;if(k==='duvar'||k==='kule'){W.tiles.clear()}updateRes();openMyVillage()};
ACT.cvNew=()=>{if(G.gold<600||V.cv.length>=4)return;G.gold-=600;const ts=reachTowns();V.cv.push({id:++V.cvN,town:ts[0]?ts[0].id:0,mode:'sell',good:-1,guards:2,budget:200,st:'home',cargo:[0,0,0,0,0],purse:0,profit:0});updateRes();openMyVillage()};
ACT.cvTown=d=>{const c=V.cv[+d.i],ts=reachTowns();if(!ts.length)return;const k=ts.findIndex(t=>t.id===c.town);c.town=ts[(k+1)%ts.length].id;openMyVillage()};
ACT.cvMode=d=>{const c=V.cv[+d.i];c.mode=c.mode==='sell'?'buy':'sell';c.good=-1;openMyVillage()};
ACT.cvGood=d=>{const c=V.cv[+d.i];c.good=c.good>=4?-1:c.good+1;openMyVillage()};
ACT.cvBud=d=>{const c=V.cv[+d.i];c.budget=c.budget>=1000?100:c.budget+100;openMyVillage()};
ACT.cvGuard=d=>{const c=V.cv[+d.i];if(G.gold<40)return;G.gold-=40;c.guards++;updateRes();openMyVillage()};
$('homeB').onclick=()=>{if(!encounter)openMyVillage()};
// --- evlilik ---
function cands(n){PL.cand=PL.cand||[];if(!PL.cand[n]||(G.day-(PL.cand[n].day||0))>200){const fr=['Kralın akrabası','Soylu aile','Tüccar ailesi'];PL.cand[n]={day:G.day,l:[0,1].map(i=>({name:RN[n][4+((Math.random()*4|0)+i)%4]+(i?' ':''),from:fr[Math.random()*3|0],dowry:200+(Math.random()*800|0)}))}}return PL.cand[n].l}
function marryHtml(s){if(PL.spouse)return'';if(PL.rank<1)return'<div class="note">Evlenmek için Şövalye rütbesi gerekir.</div>';
 return cands(s.nat).map((c,i)=>`<button class="btn" data-a="marry" data-i="${i}" data-n="${s.nat}" ${G.gold>=500?'':'disabled'}>Evlilik: ${c.name.trim()} (${c.from}) <span>başlık 500 · çeyiz ~${c.dowry}</span></button>`).join('')}
ACT.marry=d=>{const n=+d.n,c=cands(n)[+d.i];if(!c||PL.spouse||G.gold<500)return;G.gold-=500;
 const ch=.35+G.renown/600+(n===G.nat?PL.favor/300:0);
 if(Math.random()<ch){PL.spouse={name:c.name.trim(),nat:n};PL.kids=[];G.gold+=c.dowry;G.renown+=20;if(n===G.nat)PL.favor=Math.min(100,PL.favor+15);plog(`${c.name.trim()} ile evlendin! Çeyiz: ${c.dowry} altın.`);PL.cand[n]=null}
 else{G.gold+=0;toast('Teklifin kabul edilmedi; hediyeler iade edilmedi.')}updateRes();openSettlement(curSetl)};

// ===== Modül 11: Demircilik, Arena, Atölye, Yaşlanma, Haraç =====
const WQ=[['Paslı',.9],['Dengeli',1],['Usta İşi',1.22]];
function townExtraOld(s){const i=W.setl.indexOf(s),ws=(G.ws||[]).includes(i);
 return (s.port?`<div class="note">Liman kenti: ticaret gemileri krallığa her sefer 22 altın getirir, balık %15 ucuz, gönüllü akışı artar.</div>`:'')+`<button class="btn" data-a="forge">Demirci: silah dövdür <span>2 demir + 40 altın</span></button><button class="btn" data-a="arena" data-i="${i}">Arena: turnuva <span>100 altın bahis</span></button>`+(ws?'<div class="note">Bu kentte atölyen var (+30 altın/gün).</div>':`<button class="btn" data-a="wshop" data-i="${i}">Atölye kur <span>500 altın · +30/gün</span></button>`)}
ACT.forge=()=>{const q=G.wq==null?-1:G.wq;if(G.inv[3]<2||G.gold<40){toast('2 demir ve 40 altın gerekir');return}
 G.inv[3]-=2;G.gold-=40;const r=Math.random(),k=r<.3?0:r<.8?1:2;G.wq=k;G.wdm=WQ[k][1];toast('Dövüldü: '+WQ[k][0]+' kılıç (hasar x'+WQ[k][1]+')');wmsg('Demirci '+WQ[k][0]+' bir kılıç yaptı.');closePanel()};
ACT.wshop=d=>{const i=+d.i;G.ws=G.ws||[];if(G.ws.includes(i))return;if(G.gold<500){toast('500 altın gerekir');return}G.gold-=500;G.ws.push(i);toast('Atölye kuruldu');closePanel()};
ACT.tribute=()=>{const p=encounter,c=Math.max(60,partyN(p)*12);if(G.gold<c){toast('Yeterli altının yok');return}G.gold-=c;p.think=14;p.cool=10;p.tx=p.hx;p.ty=p.hy;encounter=null;closePanel();toast('Haraç ödendi: '+c+' altın')};
ACT.arena=()=>{if(G.gold<100){toast('100 altın gerekir');return}const n=Math.min(healthyCount(),3),pl=[];let k=n;for(const s of G.stacks){const m=Math.min(s.count-s.wounded,k);if(m>0){pl.push({id:s.id,count:m});k-=m}}
 const en=[{id:0,count:3+Math.floor(G.hero.lvl/2)}];G.gold-=100;encounter={arena:true,name:'Arena',troops:en};closePanel();
 startBattle({pl,en:en.map(t=>({...t})),terr:0,heroNat:G.nat,mounted:false,lvl:G.hero.lvl,wdm:G.wdm||1,enemyName:'Arena'})};
function arenaEnd(won){let h='<h2>'+(won?'Turnuva kazanıldı!':'Turnuva kaybedildi')+'</h2>';
 if(won){G.gold+=350;G.renown+=15;h+='<div class="sub">+350 altın, +15 nam.</div>'}else h+='<div class="sub">Bahis kaybedildi. Askerlerin sağ.</div>';
 for(const s of G.stacks)s.wounded=0;
 h+='<div class="row2"><button class="btn gold" data-a="close">Haritaya dön</button></div>';setScene('world');openPanel(h)}
function kidAge(k){return Math.floor((G.day-k.born)/360)}
function charDaily(){if(!G.age)G.age=25;if(!G.name)G.name='Kahraman';
 for(const i of G.ws||[]){G.gold+=30}
 if(G.day>0&&G.day%360===0){G.age++;wmsg('Yaşlandın: '+G.age);
  if(G.age>=60&&Math.random()<(G.age-58)*.12){const kids=PL.kids.filter(k=>kidAge(k)>=15);
   if(kids.length){const h=kids[0];wmsg('Kahramanın öldü. '+h.name+' hanedanı devraldı.',1);PL.kids=PL.kids.filter(k=>k!==h);G.name=h.name;G.age=kidAge(h);G.hero.lvl=Math.max(1,Math.floor(G.hero.lvl*.6));G.hero.xp=0;G.renown=Math.floor(G.renown*.6);G.wq=null;G.wdm=1;toast('Varis: '+h.name)}
   else wmsg('Yaşlandın ama devralacak varisin yok. Evlen!',1)}}}
ACT.char=()=>{const r=typeof RANKS!=='undefined'?RANKS[PL.rank]:'';const w=G.wq==null?'Yok':WQ[G.wq][0]+' (x'+G.wdm+')';
 openPanel(`<h2>${G.name||'Kahraman'}</h2><div class="sub">Yaş ${G.age||25} · ${r} · Seviye ${G.hero.lvl} · Nam ${G.renown}</div><div class="note">Silah: ${w}<br>Atölyeler: ${(G.ws||[]).length}<br>Eş: ${PL.spouse?PL.spouse.name:'Yok'}<br>Çocuklar: ${PL.kids.length?PL.kids.map(k=>k.name+' ('+kidAge(k)+')').join(', '):'Yok'}<br>60 yaşından sonra ölüm olasılığı artar; 15+ yaşında çocuk varis olur.</div><div class="row2"><button class="btn gold" data-a="close">Kapat</button></div>`)};

const isWater=(x,y)=>coastVal(x,y)<-25;
function findDock(x,y,maxR){let best=null;for(let a=0;a<16;a++){const an=a*.3927;let prev=null;for(let r=100;r<=maxR;r+=100){const px=x+Math.cos(an)*r,py=y+Math.sin(an)*r;if(px<300||py<300||px>MW-300||py>MH-300)break;if(isWater(px,py)){if(prev&&(!best||r<best.r))best={r,dock:[px,py],shore:prev};break}if(coastVal(px,py)>20)prev=[px,py]}}return best}
function buildPorts(used){
 // kıyı kaleleri
 for(let n=0;n<5;n++){let want=Math.max(2,Math.round(9*CM*(W.setl.filter(s=>s.nat===n).length/W.setl.length)*1)),got=0;
  for(let t=0;t<2500&&got<want;t++){const x=500+wr()*(MW-1000),y=500+wr()*(MH-1000),c=coastVal(x,y);if(c<135||c>240||ridgeAt(x,y)>.55||aridAt(x,y)>.85||regionAt(x,y)!==n)continue;if(!W.setl.every(o=>Math.hypot(o.x-x,o.y-y)>900))continue;
   const d=findDock(x,y,700);if(!d)continue;W.setl.push({id:W.setl.length,sd:1000+W.setl.length*7919,name:sName(n,used)+' Limanı',type:'castle',town:false,cap:false,castle:true,nat:n,x,y,vol:4+(wr()*5|0),merc:[],r:SRAD.castle});got++}}
 for(const s of W.setl){if(s.type==='village'){const d=findDock(s.x,s.y,500);if(d){s.fish=true;s.dock=d.dock;s.shore=d.shore}}
  else{const d=findDock(s.x,s.y,s.name.endsWith('Limanı')?700:1100);if(d){s.port=true;s.dock=d.dock;s.shore=d.shore}}}}
function drawHarbor(g,s){const[sx,sy]=s.shore,[dx,dy]=s.dock,a=Math.atan2(dy-sy,dx-sx);g.save();g.translate(sx,sy);g.rotate(a);
 g.fillStyle='#7b5632';g.fillRect(-6,-5,70,10);g.strokeStyle='#3a2814';g.lineWidth=1.2;for(let i=0;i<7;i++){g.beginPath();g.moveTo(i*10,-5);g.lineTo(i*10,5);g.stroke()}
 g.fillStyle='#2a1c10';for(let i=0;i<4;i++){g.fillRect(i*18-2,-7,4,3);g.fillRect(i*18-2,4,4,3)}
 if(s.port){g.fillStyle='#a9774a';g.fillRect(-26,-12,18,16);g.fillStyle='#5a3a22';g.beginPath();g.moveTo(-28,-12);g.lineTo(-17,-22);g.lineTo(-6,-12);g.fill()}
 g.restore()}
// kuşbakışı su yolu (kaba ızgara)
const WG=300,wgW=Math.ceil(MW/WG),wgH=Math.ceil(MH/WG);let wgP=null;
function wgInit(){if(wgP)return;wgP=new Uint8Array(wgW*wgH);for(let j=0;j<wgH;j++)for(let i=0;i<wgW;i++)wgP[j*wgW+i]=coastVal(i*WG+WG/2,j*WG+WG/2)<-15?1:0}
function wgNear(x,y){const ci=Math.min(wgW-1,x/WG|0),cj=Math.min(wgH-1,y/WG|0);for(let r=0;r<6;r++)for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++){const i=ci+a,j=cj+b;if(i>=0&&j>=0&&i<wgW&&j<wgH&&wgP[j*wgW+i])return[i,j]}return null}
function seaPath(A,B){wgInit();const s=wgNear(A[0],A[1]),t=wgNear(B[0],B[1]);if(!s||!t)return null;const prev=new Int32Array(wgW*wgH).fill(-2),q=[s[1]*wgW+s[0]],T=t[1]*wgW+t[0];prev[q[0]]=-1;
 for(let h=0;h<q.length&&prev[T]===-2;h++){const c=q[h],ci=c%wgW,cj=c/wgW|0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const i=ci+a,j=cj+b;if(i<0||j<0||i>=wgW||j>=wgH)continue;const n=j*wgW+i;if(prev[n]!==-2||!wgP[n])continue;if(a&&b&&(!wgP[cj*wgW+i]||!wgP[j*wgW+ci]))continue;prev[n]=c;q.push(n)}}
 if(prev[T]===-2)return null;const pts=[];let c=T;while(c>=0){pts.push([(c%wgW)*WG+WG/2,((c/wgW)|0)*WG+WG/2]);c=prev[c]}pts.reverse();pts.unshift(A);pts.push(B);return pts}
function portsNear(x,y,R){return W.setl.filter(s=>s.port&&Math.hypot(s.x-x,s.y-y)<R)}
function shipSync(){if(!W.ships||!G)return;
 W.ships=W.ships.filter(b=>b.my||Math.hypot(b.x-P.x,b.y-P.y)<16000);let made=0;
 for(const s of portsNear(P.x,P.y,9000)){if(made>=3)break;if(!W.ships.some(b=>b.k==='trade'&&b.port===s)){
   const cand=W.setl.filter(o=>o.port&&o!==s&&o.nat===s.nat&&Math.hypot(o.x-s.x,o.y-s.y)<14000).sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y));let path=null,to=null;
   for(const o of cand.slice(0,4)){path=seaPath(s.dock,o.dock);if(path&&path.length>3){to=o;break}}
   made++;if(path)W.ships.push({k:'trade',port:s,to,nat:s.nat,path,pi:0,dir:1,x:path[0][0],y:path[0][1],ang:0,wait:0});else W.ships.push({k:'trade',port:s,nat:s.nat,path:[s.dock,s.dock],pi:0,dir:1,x:s.dock[0],y:s.dock[1],ang:0,wait:0,still:1})}}
 for(const s of W.setl){if(!(s.port||s.fish)||Math.hypot(s.x-P.x,s.y-P.y)>9000)continue;if(!W.ships.some(b=>b.k==='fish'&&b.port===s&&!b.my)){for(let i=0;i<(s.port?2:1);i++)W.ships.push(mkBoat(s.dock,s,s.nat,false,i))}}
 if(V&&vSetl){if(V.b.iskele&&!V.fd)V.fd=findDock(V.x,V.y,900);
  const want=V.b.iskele?Math.min(6,V.b.iskele*2):0;if(V.fd&&want){const mine=W.ships.filter(b=>b.my);for(let i=mine.length;i<want;i++)W.ships.push(mkBoat(V.fd.dock,null,G.nat,true,i));if(mine.length>want)W.ships=W.ships.filter(b=>!b.my||mine.indexOf(b)<want)}}}
function mkBoat(dock,port,nat,my,i){let r=240+i*70;for(;r>40;r-=30){let ok=true;for(let a=0;a<8;a++)if(!isWater(dock[0]+Math.cos(a*.785)*r,dock[1]+Math.sin(a*.785)*r)){ok=false;break}if(ok)break}
 return{k:'fish',port,nat,my,c:dock,r,ph:i*2.4+Math.random()*3,x:dock[0],y:dock[1],ang:0}}
function shipTick(h){if(!W.ships)return;for(const b of W.ships){
  if(b.k==='fish'){b.ph+=h*.35;const nx=b.c[0]+Math.cos(b.ph)*b.r,ny=b.c[1]+Math.sin(b.ph*.8)*b.r*.7;b.ang=Math.atan2(nx-b.x,-(ny-b.y));b.x=nx;b.y=ny;continue}
  if(b.still)continue;if(b.wait>0){b.wait-=h;continue}
  let rem=60*SPM*h;while(rem>0){const t=b.path[b.pi+b.dir];if(!t){b.dir*=-1;b.wait=3;const dest=b.dir===-1?b.to:b.port;if(dest){const inc=22;if(PL&&PL.kings&&PL.kings[b.nat])PL.kings[b.nat].gold+=inc;dest.vol=Math.min(12,dest.vol+1)}break}
   const dx=t[0]-b.x,dy=t[1]-b.y,m=Math.hypot(dx,dy);b.ang=Math.atan2(dx,-dy);if(m<=rem){b.x=t[0];b.y=t[1];b.pi+=b.dir;rem-=m}else{b.x+=dx/m*rem;b.y+=dy/m*rem;rem=0}}}}
function shipDaily(){if(!W.setl||!PL)return;let n=[0,0,0,0,0];for(const s of W.setl)if(s.port){n[s.nat]+=s.town?3:2;if(G.day%3===0&&s.vol<12)s.vol++}
 if(PL.kings)for(let i=0;i<5;i++)if(PL.kings[i])PL.kings[i].gold+=n[i];if(G.day%2===0)shipSync()}
function drawShips(g,inV,z){const k=Math.min(1.2,Math.max(.7,z*1.5))/z;for(const b of W.ships){if(!inV(b.x,b.y))continue;const c=NATIONS[b.nat]?NATIONS[b.nat].c:'#ccc';g.save();g.translate(b.x,b.y);g.scale(k,k);g.rotate(b.ang);
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(0,16,5,14,0,0,7);g.fill();
  if(b.k==='trade'){g.fillStyle='#5a3a22';g.beginPath();g.moveTo(-9,10);g.lineTo(-7,-12);g.lineTo(0,-18);g.lineTo(7,-12);g.lineTo(9,10);g.closePath();g.fill();g.strokeStyle='#2a1c10';g.lineWidth=1;g.stroke();
   g.fillStyle='#e9dcb8';g.beginPath();g.moveTo(0,-12);g.lineTo(11,-1);g.lineTo(0,4);g.closePath();g.fill();g.fillStyle=c;g.fillRect(-1,-11,2,14);g.beginPath();g.moveTo(0,-12);g.lineTo(-8,-8);g.lineTo(0,-5);g.fill();
   g.fillStyle='#8a6a40';g.fillRect(-3,4,6,5)}
  else{g.fillStyle=b.my?'#8a5a32':'#6a4a30';g.beginPath();g.moveTo(-4,8);g.lineTo(-3,-7);g.lineTo(0,-11);g.lineTo(3,-7);g.lineTo(4,8);g.closePath();g.fill();g.strokeStyle='#2a1c10';g.lineWidth=.9;g.stroke();
   g.strokeStyle='rgba(240,230,200,.8)';g.beginPath();g.arc(0,12,4,.3,2.8);g.stroke();g.fillStyle=b.my?'#ffd36a':c;g.fillRect(-1,-3,2,4)}
  g.restore()}}

const REPN=['Onur','Merhamet','Acımasızlık','Tüccar','Haydut'];
const repLv=k=>1+Math.min(3,Math.floor((G&&G.rep?G.rep[k]:0)/26));
function repAdd(k,v){if(!G.rep)G.rep=[0,0,0,0,0];const o=repLv(k);G.rep[k]=Math.max(0,Math.min(100,G.rep[k]+v));
 if(v>0){if(k===1)G.rep[2]=Math.max(0,G.rep[2]-v*.5);if(k===2)G.rep[1]=Math.max(0,G.rep[1]-v*.5);if(k===0)G.rep[4]=Math.max(0,G.rep[4]-v*.4);if(k===4)G.rep[0]=Math.max(0,G.rep[0]-v*.4)}
 const n=repLv(k);if(n!==o)wmsg(`Şöhret ${n>o?'yükseldi':'düştü'}: ${REPN[k]} ${n}/4`,n<o)}
function relAdd(n,v){G.rel[n]=Math.max(-100,Math.min(100,G.rel[n]+v))}
function slog(t){G.slog=G.slog||[];G.slog.push(`Gün ${G.day+1}: ${t}`);if(G.slog.length>14)G.slog.shift()}
function gInit(){xInit();chInit();if(!G.rep)G.rep=[0,0,0,0,0];if(!G.rel)G.rel=[0,0,0,0,0];if(!G.items)G.items=[];if(!G.eq)G.eq=[null,null,null,null];if(G.pr==null)G.pr=0;if(!G.campT)G.campT=[];if(G.wq!=null&&!G.items.length){addItem(0,G.wq);G.wq=null;G.wdm=1}}

const WT=['Kılıç','Mızrak','Yay','Ok Demeti'],QN=['Paslı','Dengeli','Usta İşi'],QM=[.95,1.05,1.25];
const itName=i=>`${QN[i.q]} ${WT[i.t]}${i.lv?' +'+i.lv:''}`,itP=i=>QM[i.q]*(1+.12*i.lv)*(1+.02*Math.min(5,Math.floor(Math.sqrt((i.use||0)/3))));
function addItem(t,q){const it={id:(G.iid=(G.iid||0)+1),t,q,lv:0};G.items.push(it);if(!G.eq)G.eq=[null,null,null,null];const cur=eqItem(t);if(!cur||itP(it)>itP(cur))G.eq[t]=it.id;return it}
function randLoot(){const t=Math.random()*4|0,r=Math.random();return addItem(t,r<.5?0:r<.88?1:2)}
function eqItem(t){const e=G.eq&&G.eq[t];return e!=null&&G.items?G.items.find(x=>x.id===e)||null:null}
function weaponFx(){const a=eqItem(0),b=eqItem(1),c=eqItem(2),d=eqItem(3),pm=b?itP(b):0;return{hero:(a?itP(a):1)*(b?1+(pm-1)*.5:1)*(G.sk?1+.03*skL('kil')+.015*skL('miz'):1),reach:b?1+(pm-.6)*.35:1,arch:(c?itP(c):1)*(G.sk?1+.03*skL('yay'):1),ammo:d?1+.18*itP(d):1}}
function applyGear(){const f=weaponFx();if(hero>=0)rng[hero]*=f.reach;for(let i=0;i<N;i++){if(i===hero||team[i]!==0)continue;if(ammo[i]>0){atk[i]*=f.arch;ammo[i]=Math.round(ammo[i]*f.ammo)}}xGear()}

 for(const t of[0,1,2,3]){const l=G.items.filter(i=>i.t===t);if(!l.length)continue;h+=`<div class="note" style="margin-top:8px"><b>${WT[t]}</b></div>`;

function townExtra(s){const i=W.setl.indexOf(s),ws=(G.ws||[]).includes(i);let h=(s.port?`<div class="note">Liman kenti: ticaret gemileri krallığa her sefer 22 altın getirir, balık %15 ucuz, gönüllü akışı artar.</div>`:'');
 h+=`<button class="btn" data-a="forge">Demirci: kılıç dövdür <span>2 demir + 40 altın</span></button><button class="btn" data-a="invp">Silahları işle &amp; sat</button><button class="btn" data-a="arena" data-i="${i}">Arena: turnuva <span>100 altın bahis</span></button>`;
 if(G.pr>0)h+=`<div class="note">Tutsak: <b>${G.pr}</b> · burada kişi başı ${prPrice(s)} altın</div><button class="btn" data-a="sellPr">Tutsakları sat <span>${G.pr*prPrice(s)} altın</span></button><button class="btn" data-a="freePr">Serbest bırak <span>Merhamet</span></button><button class="btn" data-a="recPr">Askere teklif et <span>%40 katılır</span></button>`;
 return h+(ws?'<div class="note">Bu kentte atölyen var (+30 altın/gün, silah işleme %40 ucuz).</div>':`<button class="btn" data-a="wshop" data-i="${i}">Atölye kur <span>500 altın · +30/gün</span></button>`)}

function campSpawn(c){const n=12+((c.x+c.y)%13|0)+Math.min(14,Math.floor(G.day/3)),tr=[{id:30,count:Math.ceil(n*.6)},{id:31,count:Math.ceil(n*.3)},{id:32,count:1+(n>20?1:0)}];
 const p={kind:'bandit',camp:true,ci:c.i,name:'Haydut Kampı',nat:5,x:c.x,y:c.y,hx:c.x,hy:c.y,tx:c.x,ty:c.y,troops:tr,spd:0,think:0};W.parties.push(p);c.p=p}
function spawnCamps(){W.camps=[];let s=4242;const R=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;
 for(let i=0,t=0;i<56&&t<8000;t++){const x=900+R()*(MW-1800),y=900+R()*(MH-1800);if(coastVal(x,y)<220||ridgeAt(x,y)>.5||aridAt(x,y)>.9)continue;if(W.setl.some(q=>Math.hypot(q.x-x,q.y-y)<1600))continue;if(W.camps.some(c=>Math.hypot(c.x-x,c.y-y)<2500))continue;W.camps.push({x,y,i,p:null});i++}
 for(const c of W.camps)if((G.campT[c.i]||0)<=G.day)campSpawn(c)}
function campDaily(){if(!W.camps)return;for(const c of W.camps)if(!(c.p&&!c.p.dead&&W.parties.includes(c.p))&&(G.campT[c.i]||0)<=G.day)campSpawn(c)}
function spoils(p,downs){if(!p||p.arena)return'';if(p.camp&&G.X)G.X.cleared++;let h='';const camp=!!p.camp,bandit=p.kind==='bandit';
 if(camp){G.campT[p.ci]=G.day+25;const ren=12+Math.round(partyN(p)/3),gd=Math.round(partyN(p)*14+Math.random()*80);G.renown+=ren;G.gold+=gd;repAdd(0,3);repAdd(4,-4);slog('Bir haydut kampını yerle bir ettin');h+=`<p class="note"><b>Kamp temizlendi!</b> Ek nam +${ren} · kamp ganimeti +${gd} altın</p>`}
 const pr=Math.min(30-G.pr,Math.round(downs*(camp?.4:.25)));if(pr>0&&(camp||bandit||p.kind==='lord')){G.pr+=pr;h+=`<p class="note">${pr} tutsak alındı (toplam ${G.pr}). Kentlerde satabilir, serbest bırakabilir ya da askere teklif edebilirsin.</p>`}
 const nL=camp?1+(Math.random()<.6?1:0)+(Math.random()<.25?1:0):Math.random()<.22?1:0,got=[];for(let i=0;i<nL;i++)got.push(itName(randLoot()));
 if(got.length)h+=`<p class="note">Düşen silahlar: ${got.join(', ')}</p>`;if(bandit&&!camp)repAdd(4,-1);return h}

function ccSummary(){if(CC.sum)return CC.sum;const tags={sav:0,tuc:0,kar:0,zek:0,giz:0,ona:0,hir:0},bio=[];

 const top=Object.keys(tags).sort((a,b)=>tags[b]-tags[a]),t1=top[0],t2=top[1],title=`${TTL[t1]}${tags[t2]>=Math.max(2,tags[t1]-1)?' · '+TTL[t2]:''}`;
 const lines=[`${CC.age} yaşında, ${CC.h} cm boyunda; ${HSTY[CC.hs].toLowerCase()} ${['siyah','koyu kestane','kestane','bakır','sarı','kızıl','kır','beyaz'][CC.hc]} saçlı${CC.g?'':', '+BRDN[CC.bd].toLowerCase()}`,...bio.map(b=>b)];

 else if(a==='go')ccFinish()}

function decProg(){const m=m20(),c=decCur(),t=DEC[c.k][2];return t==='w'?m.win-c.w0:t==='k'?G.kills-c.k0:t==='d'?m.duel-c.d0:(G.ruin?Object.keys(G.ruin).length:0)-c.r0}
ACT.m20fm=()=>{const c=decCur(),d=DEC[c.k],p=Math.min(d[3],decProg()),ok=p>=d[3];openPanel(`<h2>${d[0]}</h2><p class="note">${d[1]} (${p}/${d[3]}) · ${7-(G.day-c.s)} gün kaldı. Ödül: ${d[4]} altın + 10 nam.</p><div class="acts">${c.got?'<button class="btn" disabled>Ödül alındı</button>':ok?'<button class="btn gold" data-a="m20fc">Ödülü al</button>':''}</div><div class="row2"><button class="btn" data-a="m20">Geri</button><button class="btn gold" data-a="close">Kapat</button></div>`)};

 setTimeout(()=>{if(!document.querySelector('#ov:not(.hide)'))openPanel(`<h2>Günlük ödül</h2><p class="note">Seri: ${st} gün · +${gd} altın${sp}</p><div class="row2"><button class="btn gold" data-a="close">Al</button></div>`);updateRes()},2000)}catch(e){}}

 openPanel(`<h2>Sıralama</h2><div class="sub">Skorun: <b style="color:var(--gold)">${myScore()}</b> · Kodunu arkadaşına gönder, onun kodunu yapıştır.</div><input id="lbc" readonly value="${code}" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0006;color:#fff;font-size:12px"><button class="btn" data-a="m20lc">Kodumu kopyala</button><input id="lbi" placeholder="Arkadaşının kodunu yapıştır" style="width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid var(--line);background:#0006;color:#fff"><button class="btn" data-a="m20la">Ekle</button><div class="list">${lb.slice(0,12).map((e,i)=>`<div class="row"><b>${i+1}. ${e.n}</b><span>${e.s}</span></div>`).join('')}</div><div class="row2"><button class="btn" data-a="m20">Geri</button><button class="btn gold" data-a="close">Kapat</button></div>`)};

ACT.m20la=()=>{try{const t=decodeURIComponent(escape(atob(document.getElementById('lbi').value.trim()))).split('|'),s=+t[1];if(!t[0]||!isFinite(s))throw 0;const m=m20();m.lb=(m.lb||[]).filter(e=>e.n!==t[0]);m.lb.push({n:t[0].slice(0,20),s});ACT.m20lb()}catch(_){toast('Kod geçersiz')}};
// bayrak
const FPAT=['Dikey','Yatay','Çapraz','Haç'],FEMB=['♛','⚔','♞','✦','☗','☀'];
function flagSvg(f,w=120){const a=f.c1,b=f.c2,p=f.p;const bg=p===0?`<rect width="60" height="40" fill="${a}"/><rect width="30" height="40" fill="${b}"/>`:p===1?`<rect width="60" height="40" fill="${a}"/><rect y="20" width="60" height="20" fill="${b}"/>`:p===2?`<rect width="60" height="40" fill="${a}"/><path d="M0 40L60 0V40Z" fill="${b}"/>`:`<rect width="60" height="40" fill="${a}"/><rect x="26" width="8" height="40" fill="${b}"/><rect y="16" width="60" height="8" fill="${b}"/>`;return`<svg viewBox="0 0 60 40" width="${w}" style="border:1px solid #0008;border-radius:4px">${bg}<text x="30" y="27" text-anchor="middle" font-size="18" fill="#fff" stroke="#000" stroke-width=".6">${FEMB[f.e]}</text></svg>`}
const flg0=()=>{const m=m20();return m.flag||(m.flag={c1:'#a8322a',c2:'#e0b552',p:0,e:0})};
ACT.m20fl=()=>{const f=flg0(),C=['#a8322a','#2f5fa8','#e0b552','#2e7d4f','#6a3d9a','#222','#eee','#d06a1b'];
 openPanel(`<h2>Ordu bayrağı</h2><div style="text-align:center;margin:6px 0">${flagSvg(f,180)}</div><div class="acts"><button class="btn" data-a="m20fp" data-k="p">Desen: ${FPAT[f.p]}</button><button class="btn" data-a="m20fp" data-k="e">Amblem: ${FEMB[f.e]}</button><button class="btn" data-a="m20fp" data-k="c1">Renk 1</button><button class="btn" data-a="m20fp" data-k="c2">Renk 2</button></div><div class="row2"><button class="btn" data-a="m20">Geri</button><button class="btn gold" data-a="close">Kapat</button></div>`);M20.C=C};
ACT.m20fp=d=>{const f=flg0(),C=M20.C||['#a8322a','#2f5fa8','#e0b552'];if(d.k==='p')f.p=(f.p+1)%4;else if(d.k==='e')f.e=(f.e+1)%FEMB.length;else f[d.k]=C[(C.indexOf(f[d.k])+1)%C.length];ACT.m20fl()};
// savaş kaydı (MediaRecorder)
const recB=document.createElement('button');recB.id='recB';recB.textContent='● Kayıt';recB.style.cssText='position:fixed;z-index:6;top:calc(var(--st,0px) + 46px);right:calc(var(--sr,0px) + 8px);padding:6px 10px;border-radius:8px;border:1px solid #fff5;background:#0007;color:#fff;font:600 12px system-ui;display:none';document.body.appendChild(recB);
let mrec=null,mch=[],mto=0;
function recStop(){if(mrec&&mrec.state!=='inactive')mrec.stop();clearTimeout(mto)}
recB.onclick=()=>{if(mrec&&mrec.state==='recording'){recStop();return}try{const st=cvs.captureStream(30);const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));if(!mt){toast('Bu cihaz kaydı desteklemiyor');return}
 mch=[];mrec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:5e6});mrec.ondataavailable=e=>{if(e.data.size)mch.push(e.data)};mrec.onstop=async()=>{recB.textContent='● Kayıt';recB.style.background='#0007';const b=new Blob(mch,{type:mt}),f=new File([b],'savas.'+(mt.includes('mp4')?'mp4':'webm'),{type:mt});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Savaş kaydı'});return}}catch(_){}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();toast('Kayıt indirildi')};
 mrec.start(500);recB.textContent='■ Durdur';recB.style.background='#a8322a';mto=setTimeout(recStop,30000);toast('Kayıt başladı (en çok 30 sn)')}catch(e){toast('Kayıt başlatılamadı')}};
setInterval(()=>{recB.style.display=(typeof scene!=='undefined'&&scene==='battle'&&phase==='battle')?'block':'none';if(scene!=='battle'&&mrec&&mrec.state==='recording')recStop()},400);
// tohum
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hstr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
ACT.m20sd=()=>{const m=m20();openPanel(`<h2>Tohum paylaş</h2><div class="sub">Aynı tohumu giren oyuncularda günlük olaylar (hava, haydutlar, rüyalar, efsanevi yaratıklar) aynı günlerde benzer gelişir.</div><input id="sdi" value="${m.seed||''}" placeholder="Tohum (örn. KURTLAR)" maxlength="16" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0006;color:#fff"><div class="acts"><button class="btn" data-a="m20ss">Uygula</button><button class="btn" data-a="m20sr">Rastgele üret</button><button class="btn" data-a="m20sx">Kapat (rastgele olaylar)</button></div><div class="row2"><button class="btn" data-a="m20">Geri</button><button class="btn gold" data-a="close">Kapat</button></div>`)};
